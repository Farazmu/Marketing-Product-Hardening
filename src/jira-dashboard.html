<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Production issues by workflow</title>
<style>
:root{
 --bg:#F5F6FA;--card:#FFFFFF;--ink:#0F172A;--sec:#64748B;--mut:#94A3B8;--border:#E6E8F0;--chip:#EEF0F6;
 --accent:#4F46E5;--accent-s:rgba(79,70,229,.10);--shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05);
 --resolved:#16A34A;--progress:#D97706;--new:#2563EB;--roadmap:#7C3AED;--warn-bg:#FFFBEB;--warn-b:#FCD34D;--warn-t:#92400E;
 --err-bg:#FEF2F2;--err-b:#FCA5A5;--err-t:#991B1B;--ok-bg:#F0FDF4;--ok-b:#86EFAC;--ok-t:#166534;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0B0D12;--card:#141821;--ink:#E8ECF4;--sec:#98A2B3;--mut:#6B7587;--border:#262C38;--chip:#1E2430;
 --accent:#818CF8;--accent-s:rgba(129,140,248,.16);--shadow:0 1px 2px rgba(0,0,0,.4);
 --resolved:#4ADE80;--progress:#FBBF24;--new:#60A5FA;--roadmap:#A78BFA;--warn-bg:#2A2110;--warn-b:#7A5C14;--warn-t:#FCD34D;
 --err-bg:#2B1215;--err-b:#7F1D1D;--err-t:#FECACA;--ok-bg:#10231A;--ok-b:#166534;--ok-t:#BBF7D0;
}}
:root[data-theme="dark"]{
 --bg:#0B0D12;--card:#141821;--ink:#E8ECF4;--sec:#98A2B3;--mut:#6B7587;--border:#262C38;--chip:#1E2430;
 --accent:#818CF8;--accent-s:rgba(129,140,248,.16);--shadow:0 1px 2px rgba(0,0,0,.4);
 --resolved:#4ADE80;--progress:#FBBF24;--new:#60A5FA;--roadmap:#A78BFA;--warn-bg:#2A2110;--warn-b:#7A5C14;--warn-t:#FCD34D;
 --err-bg:#2B1215;--err-b:#7F1D1D;--err-t:#FECACA;--ok-bg:#10231A;--ok-b:#166534;--ok-t:#BBF7D0;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{max-width:1280px;margin:0 auto;padding:28px 20px 56px}
.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:26px;line-height:1.2;font-weight:650;letter-spacing:-.02em;margin:0 0 6px}
.top p{margin:0;color:var(--sec);font-size:14px}
.search{position:relative;display:block;width:min(100%,300px)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut);pointer-events:none}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);padding:0 12px 0 36px;font-size:14px;box-shadow:var(--shadow)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}
.card+.card{margin-top:16px}
.ctl{margin-bottom:20px;display:flex;flex-direction:column;gap:14px}
.crow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dates label{font-size:12px;color:var(--sec);display:flex;flex-direction:column;gap:2px}
.dates input[type=date]{height:36px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:0 10px;font-size:14px;color-scheme:light dark}
.dates .arrow{color:var(--mut);padding-top:16px}
.btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{color:#fff;opacity:.92}
.btn[disabled]{opacity:.55;cursor:default}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets .btn[aria-pressed=true]{border-color:var(--accent);background:var(--accent-s);color:var(--accent);font-weight:600}
.spacer{flex:1}
.src{font-size:12.5px;border-radius:999px;padding:4px 10px;border:1px solid var(--border);color:var(--sec);display:inline-flex;gap:6px;align-items:center}
.src.live{background:var(--ok-bg);border-color:var(--ok-b);color:var(--ok-t)}
.src.snap{background:var(--warn-bg);border-color:var(--warn-b);color:var(--warn-t)}
.src.busy{color:var(--accent);border-color:var(--accent)}
.notice{font-size:13px;border-radius:10px;padding:8px 12px;border:1px solid var(--warn-b);background:var(--warn-bg);color:var(--warn-t)}
.notice.err{border-color:var(--err-b);background:var(--err-bg);color:var(--err-t)}
.notice[hidden]{display:none}
.seg{display:inline-flex;padding:3px;background:var(--chip);border-radius:12px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;color:var(--sec)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.14)}
.dd{position:relative;display:inline-block}
.ddbtn{display:inline-flex;align-items:center;gap:8px;height:36px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:0 12px;cursor:pointer;font-size:13.5px}
.ddbtn:hover,.ddbtn[aria-expanded=true]{border-color:var(--accent)}
.ddbtn .car{width:9px;height:9px;border-right:2px solid var(--sec);border-bottom:2px solid var(--sec);transform:rotate(45deg) translate(-2px,-2px);display:inline-block}
.ddbtn .cnt{color:var(--sec)}
.ddpanel{position:absolute;z-index:45;top:calc(100% + 6px);left:0;min-width:270px;max-height:360px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.22);padding:6px}
.ddpanel[hidden]{display:none}
.ddhead{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 6px;border-bottom:1px solid var(--border);margin-bottom:4px}
.ddhead b{font-size:12px;color:var(--sec);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ddgrp{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding:8px 8px 2px}
.ddrow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;cursor:pointer;border-radius:8px;padding:6px 8px;font-size:13.5px}
.ddrow:hover{background:var(--chip)}
.ddrow .box{width:16px;height:16px;border:1.5px solid var(--mut);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:#fff}
.ddrow[aria-checked=true] .box{background:var(--accent);border-color:var(--accent)}
.ddrow .nm{display:flex;gap:8px;align-items:center;min-width:0}
.ddrow .n{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12.5px}
.lbl{font-size:12.5px;color:var(--sec);min-width:48px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--border);background:transparent;border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--sec)}
.chip .n{font-variant-numeric:tabular-nums;color:var(--mut)}
.chip[aria-pressed=true]{color:var(--ink);border-color:color-mix(in srgb,var(--c) 55%,var(--border));background:color-mix(in srgb,var(--c) 12%,transparent)}
.chip[aria-pressed=false]{opacity:.5}
.chip:hover{opacity:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.link{border:0;background:none;color:var(--accent);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px}
.layout[hidden]{display:none}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 32px);overflow-y:auto}
.gl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:10px 10px 4px}
.nav{border:0;background:none;text-align:left;cursor:pointer;border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;width:100%}
.nav:hover{background:var(--chip)}
.nav[aria-current=page]{background:var(--accent-s)}
.nav[aria-current=page] .nm{color:var(--accent);font-weight:600}
.nav .nm{font-size:14px}
.nav .ct{font-size:12px;color:var(--sec);font-variant-numeric:tabular-nums}
.nav .bar{grid-column:1/-1}
.nav.zero{opacity:.4}
.bar{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--chip)}
.bar span{display:block;height:100%}
.b-resolved{background:var(--resolved)}.b-progress{background:var(--progress)}.b-new{background:var(--new)}.b-roadmap{background:var(--roadmap)}
.mobsel{display:none;width:100%;height:40px;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:0 10px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{text-align:left;border:1px solid var(--border);background:var(--card);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--accent)}
.kpi[aria-pressed=true]{border-color:var(--accent);background:var(--accent-s)}
.kpi .l{font-size:12.5px;color:var(--sec);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .p{font-size:12px;color:var(--mut)}
h2{font-size:18px;line-height:1.3;font-weight:650;margin:0 0 2px}
h3{font-size:14px;font-weight:650;margin:0 0 10px}
.sub{color:var(--sec);font-size:13.5px;margin:0 0 12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--sec);margin-bottom:6px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.chartwrap{overflow-x:auto}
.empty{padding:28px 8px;text-align:center;color:var(--sec)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:11px 4px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row .k{font-size:13px;font-variant-numeric:tabular-nums;font-weight:600}
.row .k a{color:var(--accent);text-decoration:none}
.row .k a:hover{text-decoration:underline}
.row .t{font-size:14px;overflow-wrap:anywhere}
.row .m{font-size:12px;color:var(--sec);margin-top:2px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid color-mix(in srgb,var(--c) 45%,var(--border));background:color-mix(in srgb,var(--c) 12%,transparent)}
.pr{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--sec)}
.pr.hot{background:color-mix(in srgb,#DC2626 14%,transparent);color:#DC2626}
.pr.hi{background:color-mix(in srgb,#EA580C 14%,transparent);color:#EA580C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pr.hot{color:#FCA5A5}:root:not([data-theme="light"]) .pr.hi{color:#FDBA74}}
:root[data-theme="dark"] .pr.hot{color:#FCA5A5}:root[data-theme="dark"] .pr.hi{color:#FDBA74}
.more{text-align:center;padding-top:12px}

.viewbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.viewbar .hint{font-size:12.5px;color:var(--sec)}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.spill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--sec)}
.spill b{color:var(--ink);font-variant-numeric:tabular-nums}
.fhead{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.fhead>div:first-child{flex:1;min-width:260px}
.fhead h2{font-size:22px;margin-bottom:6px}
.fhead p{margin:0;color:var(--sec);font-size:14px;max-width:760px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;background:var(--chip);color:var(--sec);margin-left:8px;vertical-align:middle;font-weight:500}
.flowcard{padding:26px 16px 30px}
.flow{display:flex;flex-direction:column;align-items:center}
.fnode{width:min(250px,86%);border:1px solid var(--border);background:var(--chip);border-radius:12px;padding:10px 14px;text-align:center}
.fnode b{display:block;font-size:14.5px}
.fnode span{font-size:12.5px;color:var(--sec)}
.gap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;padding:8px 0;min-height:44px}
.gap::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--border)}
.gap.has::before{background:#EF4444;opacity:.8}
.gap::after{content:"";position:absolute;bottom:0;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--mut);border-bottom:0}
.gap.has::after{border-top-color:#EF4444}
.gap.last::after{display:none}
.frow{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:5px 0}
.fl,.fr{font-size:12.5px;color:var(--sec);line-height:1.35}
.fl{text-align:right;padding-left:6px}
.fr{text-align:left;padding-right:6px}
.fpill{border:1.5px solid #EF4444;background:color-mix(in srgb,#EF4444 14%,var(--card));color:#DC2626;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.fpill:hover,.fpill[aria-pressed=true]{background:#EF4444;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fpill{color:#FCA5A5}:root:not([data-theme="light"]) .fpill:hover,:root:not([data-theme="light"]) .fpill[aria-pressed=true]{color:#fff}}
:root[data-theme="dark"] .fpill{color:#FCA5A5}:root[data-theme="dark"] .fpill:hover,:root[data-theme="dark"] .fpill[aria-pressed=true]{color:#fff}
.subrow .body{display:flex;flex-direction:column;gap:5px;min-width:0}
.subrow .l{font-size:14px}
.fnote{font-size:12px;color:var(--mut);padding:8px 10px}
.back{margin-bottom:6px;padding-left:0}
.tip{position:fixed;z-index:60;width:min(430px,92vw);background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.22);padding:10px 12px;font-size:12.5px;color:var(--ink)}
.tip[hidden]{display:none}
.tip .th{font-weight:650;font-size:13px;margin-bottom:2px}
.tip .ts{color:var(--sec);margin-bottom:6px}
.tip .ti{display:grid;grid-template-columns:52px minmax(0,1fr);gap:1px 8px;padding:6px 0;border-top:1px solid var(--border)}
.tip .ti a{color:var(--accent);text-decoration:none;font-weight:600;font-variant-numeric:tabular-nums}
.tip .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip .tm{grid-column:2;color:var(--sec);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tip .tw{grid-column:2;color:var(--sec);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tip .tf{color:var(--mut);padding-top:6px;border-top:1px solid var(--border)}
.why{font-size:12px;color:var(--sec);margin-top:3px;font-style:italic}
.causes{margin-top:22px;border:1.5px dashed var(--border);border-radius:12px;padding:14px 18px}
.causes h3{margin-bottom:6px}
.causes ul{margin:0;padding-left:18px;color:var(--sec);font-size:13.5px}
.causes li{margin:4px 0}
.causes a,.fl a{color:var(--accent);text-decoration:none}
.fsel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.fpl{font-size:11px;border-radius:6px;padding:1px 6px;background:color-mix(in srgb,#EF4444 12%,transparent);color:#DC2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fpl{color:#FCA5A5}}
:root[data-theme="dark"] .fpl{color:#FCA5A5}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.ovc{text-align:left;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.ovc:hover{border-color:var(--accent)}
.ovc .n{font-size:24px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.ovc .t{font-size:14px;font-weight:600}
.ovc .s{font-size:12.5px;color:var(--sec)}
.subrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:9px 4px;border-top:1px solid var(--border);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.subrow:first-child{border-top:0}
.subrow:hover{background:var(--chip)}
.subrow .c{font-weight:650;font-variant-numeric:tabular-nums;font-size:15px}
.subrow .l{font-size:14px}
.subrow .m{font-size:12px;color:var(--sec)}
.subrow .o{font-size:12px;color:var(--progress);white-space:nowrap}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.layout{grid-template-columns:1fr}.side{display:none}.mobsel{display:block}.app{padding:20px 14px 40px}.row{grid-template-columns:76px minmax(0,1fr)}.row .s{grid-column:2}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <div><h1>Production issues by workflow</h1><p id="sub"></p></div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search key, title, workflow" aria-label="Search tickets"></label>
 </div>

 <div class="card ctl">
  <div class="crow">
   <div class="dates">
    <label>From<input type="date" id="from"></label><span class="arrow">→</span>
    <label>To<input type="date" id="to"></label>
   </div>
   <div class="presets" id="presets"></div>
   <span class="spacer"></span>
   <span class="src snap" id="src"></span>
   <button class="btn primary" id="refresh">Refresh from Jira</button>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="crow">
   <span class="lbl">Module</span>
   <div class="chips" id="modchips"></div>
  </div>
  <div class="crow">
   <div class="seg" id="typeseg"></div>
   <div class="dd" id="chips"></div>
  </div>
 </div>

 <div class="viewbar"><div class="seg" id="viewseg"></div><span class="hint" id="viewhint"></span></div>
 <div class="layout" id="ticketview">
  <nav class="side" id="side" aria-label="Workflows"></nav>
  <main>
   <select class="mobsel" id="mobsel" aria-label="Workflow"></select>
   <div id="main"></div>
  </main>
 </div>
 <div class="layout" id="flowview" hidden>
  <nav class="side" id="fside" aria-label="Flow categories"></nav>
  <main>
   <select class="mobsel" id="fmobsel" aria-label="Affected module"></select>
   <div id="fmain"></div>
  </main>
 </div>
</div>

<div class="tip" id="tip" hidden role="tooltip"></div>

appear from Order Hub, mostly when the same employee logs in on another device and the first POS auto-logs out. One ticket is a display delay after payment.","steps":[{"t":"Ticket screen","s":"Unsent or unclosed ticket"},{"t":"Second device login","s":"Auto-logout on first POS"},{"t":"Order Hub","s":"Unclosed tab, last open"},{"t":"Payment","s":"Ticket list refresh"}],"fails":[{"id":"Pos::OrderHub#0","label":"Unsent or unclosed ticket deleted when auto-logout ran","frm":0,"to":1},{"id":"Pos::OrderHub#1","label":"Order Hub list not refreshed after payment","frm":2,"to":3}],"causes":["PROD-4948: on MQTT auto-logout the POS correctly called delete-unsent-items, but on success wiped all local tickets.","PROD-4916: an unpaid, unsent ticket existed only on the host POS and was deleted when the same employee continued on a second POS.","PROD-4725: Order Hub loads its list once and does not refresh on MQTT ticket or payment events."]},"Pos::Ticket Screen":{"name":"Ticket screen","parent":"Pos","summary":"Two tickets: table number and server name missing on multi-POS after moving a ticket, and a modifier that does not show on an item.","steps":[{"t":"Ticket screen","s":"Items, table"},{"t":"Move ticket","s":"Table to table"},{"t":"Second POS","s":"Open moved ticket"}],"fails":[{"id":"Pos::Ticket Screen#0","label":"Modifier linked in the backend does not show on the item","frm":0,"to":0},{"id":"Pos::Ticket Screen#1","label":"Table and server saved as null after a move","frm":1,"to":2}],"causes":["PROD-5028: R8 stripped MQTT model members in release builds, so table and employee JSON was saved as nulls. Only reproduced in the release APK.","PROD-5088: the database shows the modifier linked since 9 Nov while the on-site team does not see it."]},"Pos::Table Layout":{"name":"Table layout","parent":"Pos","summary":"Tables stay occupied after a split, or a ticket shows on the layout while the table looks free.","steps":[{"t":"Table layout","s":"Occupied, free"},{"t":"Open ticket","s":"Tap a table"},{"t":"Split and pay","s":"Split check"},{"t":"Free table","s":"Release the table"}],"fails":[{"id":"Pos::Table Layout#0","label":"Table not freed after a split ticket was deleted","frm":2,"to":3},{"id":"Pos::Table Layout#1","label":"Wrong ticket opened after Order Hub and clock-out","frm":0,"to":1},{"id":"Pos::Table Layout#2","label":"Tickets disappeared from the layout (repaint)","frm":0,"to":0},{"id":"Pos::Table Layout#3","label":"Table stayed occupied after the ticket was marked paid from the backend","frm":2,"to":3}],"causes":["PROD-4946, 5003: a split ticket was deleted through delete-unsent after the parent was paid and closed, so the table release never ran.","PROD-4955: navigation between Order Hub, clock-out API and the table layout carried a stale table id.","PROD-4629: likely a rare table-layout repaint issue; the tickets were still in Order Hub.","PROD-5086: the table stayed occupied because the ticket was marked fully paid from the backend without freeing the table."]},"Pos::Split Ticket":{"name":"Split ticket","parent":"Pos","summary":"Splitting by guest or by item gives wrong amounts at payment, and paying one check afterwards greys out void, table and server options.","steps":[{"t":"Ticket screen","s":"Items sent, Hold"},{"t":"Split screen","s":"By guest or by item"},{"t":"Payment screen","s":"Pay each split check"},{"t":"Remaining check","s":"Overflow menu"}],"fails":[{"id":"Pos::Split Ticket#0","label":"Wrong amounts at payment","frm":1,"to":2},{"id":"Pos::Split Ticket#1","label":"Void, table, server options greyed out","frm":2,"to":3}],"causes":["PROD-4932: re-splitting divides an open-amount comp by guests, not tickets, so it compounds into negative totals.","PROD-4732: after a split, paying one check makes the POS treat the whole order as partially paid.","PROD-4977: an item renamed and re-priced mid-journey changed on split; treated as expected behaviour."]},"Pos::Void":{"name":"Void","parent":"Pos","summary":"Voided tickets l to out of stock, an item that was not visible, nested modifier sorting, and disabled quantity buttons.","steps":[{"t":"Menu list","s":"Menus on POS"},{"t":"Item list","s":"Menu items"},{"t":"Ticket screen","s":"Add item"}],"fails":[{"id":"Pos::Menu#0","label":"Scheduled menu would not open until the app was refreshed","frm":0,"to":1},{"id":"Pos::Menu#1","label":"Item reverted to out of stock or was not visible","frm":1,"to":1},{"id":"Pos::Menu#2","label":"Nested modifier sorting not reflected on POS and kiosk","frm":1,"to":1},{"id":"Pos::Menu#3","label":"Quantity buttons disabled when adding an item","frm":2,"to":2}],"causes":["PROD-4887: the POS did not refresh the menu list when a scheduled menu changed, so staff had to refresh the app.","PROD-4984: an outdated subcategory menu copy re-marked the item out of stock.","PROD-5044: the item was removed from its category in the menu data, so it was not visible; now back in QA.","PROD-4918: quantity selection is now enabled when adding a new item."]},"Pos::Giftcard":{"name":"Gift card on POS","parent":"Pos","summary":"Migrated cards were not found, and partial gift-card payments do not show as incomplete on the payment screen.","steps":[{"t":"Gift card","s":"Upload or scan"},{"t":"Redeem","s":"Gift card tender"},{"t":"Partial payment","s":"Remaining balance"},{"t":"Ticket","s":"Close"}],"fails":[{"id":"Pos::Giftcard#0","label":"Migrated gift cards not found","frm":0,"to":1},{"id":"Pos::Giftcard#1","label":"Partial payment not shown as incomplete, ticket closes","frm":2,"to":3}],"causes":["PROD-5043: the cards were already migrated from the old gift-card system, so re-uploading gives a validation error.","PROD-4810, 4869: a partial gift-card payment does not show as partial on the payment screen. Support called it training; the team pushed back."]},"Pos::CFD":{"name":"Customer-facing display","parent":"Pos","summary":"Add Tip text is too small on the CFD for gift-card and tender payments, and one freeze on the loyalty screen could not be reproduced.","steps":[{"t":"Payment","s":"Gift card or tender"},{"t":"CFD","s":"Add Tip"},{"t":"Loyalty screen","s":"Points"}],"fails":[{"id":"Pos::CFD#0","label":"Add Tip text too small","frm":1,"to":1},{"id":"Pos::CFD#1","label":"Frozen on the loyalty points screen (not reproduced)","frm":2,"to":2}],"causes":[]},"Pos::Data Sync Issue":{"name":"POS data sync","parent":"Pos","summary":"A POS on the wrong tenant showed unpaid checks and non-menu items, and a checkout report used the wrong business name.","steps":[{"t":"Device mapping","s":"Tenant"},{"t":"Sync","s":"Menu, tickets"},{"t":"Checkout report","s":"Business name"}],"fails":[{"id":"Pos::Data Sync Issue#0","label":"POS mapped to another tenant, unexpected unpaid checks","frm":0,"to":1},{"id":"Pos::Data Sync Issue#1","label":"Wrong business name on the employee checkout report","frm":2,"to":2}],"causes":["PROD-4829: the POS was mapped to Nola’s Street about a day after the issue was reported."]},"Pos::Backend API/Query Performance":{"name":"Backend API and query performance","parent":"Pos","summary":"The backend gets stuck on the database, which duplicates a send, blocks customer creation or slows ticket refresh.","steps":[{"t":"POS action","s":"Send, create customer"},{"t":"Backend API","s":"Request"},{"t":"Database","s":"Reads and writes"}],"fails":[{"id":"Pos::Backend API/Query Performance#0","label":"Backend stuck on the database, ticket sent twice","frm":1,"to":2},{"id":"Pos::Backend API/Query Performance#1","label":"Replica lag blocks creating a customer","frm":1,"to":2},{"id":"Pos::Backend API/Query Performance#2","label":"Slow ticket/by-order query","frm":1,"to":2}],"causes":["PROD-4809: the backend was stuck on the database for about a minute, so the POS retried the send.","PROD-4803: writes go to the primary and reads to a replica that lags."]},"Pos::Item Not Adding / Missing from Ticket":{"name":"Item missing from ticket","parent":"Pos","summary":"One ticket: items were marked sent ng","frm":0,"to":0},{"id":"Pos::POS Freeze / Crash / Lag#2","label":"Crash opening a ticket from Order Hub","frm":1,"to":2},{"id":"Pos::POS Freeze / Crash / Lag#3","label":"Crash parsing an amount or payment status","frm":2,"to":3},{"id":"Pos::POS Freeze / Crash / Lag#4","label":"Clock-in screen crash","frm":3,"to":4},{"id":"Pos::POS Freeze / Crash / Lag#5","label":"Logging crash (location permission)","frm":4,"to":4},{"id":"Pos::POS Freeze / Crash / Lag#6","label":"NullPointerException crashes, screen not recorded (closed, no fix needed)","frm":0,"to":0}],"causes":["PROD-4664: the adapter read positions that no longer existed after the list was cleared and refilled.","PROD-4726: a null or unknown payment status crashed; it now defaults to unpaid.","PROD-4909: the logger crash was tied to location permission.","PROD-4907: minimising on Quick Serve then reopening created a new ticket and froze the screen.","PROD-5054, 5053: judged not to affect the app, so no fix was made."]},"Pos::Pos - 3PO":{"name":"POS: 3PO orders","parent":"Pos","summary":"One ticket: Uber Eats and DoorDash orders were not coming through the POS at one location.","steps":[{"t":"Marketplace order","s":"Uber Eats, DoorDash"},{"t":"KitchenHub","s":"Webhook"},{"t":"AIO","s":"Order created"},{"t":"POS and KDS","s":"Kitchen"}],"fails":[{"id":"Pos::Pos - 3PO#0","label":"Uber Eats orders never reached KitchenHub (DoorDash worked)","frm":0,"to":1}],"causes":["PROD-5084: no Uber Eats webhook arrived for the location after 6 Nov, while DoorDash orders were saved normally; raised with KitchenHub."]},"Pos::None":{"name":"POS (sub-area not set)","parent":"Pos","summary":"Two POS bugs have no sub-area: adding a service charge sends the POS into a data sync, and a KDS connection error that persists although both KDS devices are online.","steps":[{"t":"Ticket screen","s":"Service charge, KDS"},{"t":"Backend","s":"API response"},{"t":"POS","s":"Data sync, KDS link"}],"fails":[{"id":"Pos::None#0","label":"Adding a service charge redirects to Data Sync Progress","frm":0,"to":2},{"id":"Pos::None#1","label":"KDS ERROR on the POS although both KDS devices show online","frm":2,"to":2}],"causes":["PROD-5089: the service charge was visible on POS only, so a ticket created on mPOS never had it and the backend returned 404; the POS then resynced. Enabling it for mPOS fixed it. The API should create it when the user adds it, and the POS should handle the 404."]},"Adyen/Payments::Transactions stuck on \"Authorised\"":{"name":"Transactions stuck on Authorised","parent":"Adyen/Payments","summary":"The largest single group in payments. A card is approved in Adyen but never captured. The usual cause is a ticket left unclosed, which rolls to the next business day at auto-closeout; the rest are webhook or timeout failures.","steps":[{"t":"Payment","s":"Card approved"},{"t":"Adyen authorisation","s":"Webhook to AIO"},{"t":"Capture","s":"Auto at closeout"},{"t":"Ticket closed","s":"Tip added"}],"fails":[{"id":"Adyen/Payments::Transactions stuck on \"Authorised\"#0","label":"Ticket left unclosed, rolled forward at auto-closeout","frm":2,"to":3},{"id":"Adyen/Payments::Transactions stuck on \"Authorised\"#1","label":"Webhook or tender never reached AIO (timeout, tenant not found)","frm":1,"to":2},{"id":"Adyen/Payments::Transactions stuck on \"Authorised\"#2","label":"Tip refused by the issuer","frm":2,"to":3},{"id":"Adyen/Payments::Transactions stuck on \"Authorised\"#3","label":"Several stuck transactions, cause not recorded","frm":2,"to":3}],"causes":["PROD-4703, 4956: the ticket stayed unclosed on the sale date, so the daily job rolled it forward repeatedly. Capture ran once staff closed it.","PROD-5023 (sub-area not set): database connection pool exhaustion caused payment failures, and the customer voided the ticket.","PROD-4621: tenant not found in the payments service. PROD-4865: the Adyen HTTP client has no retry or timeout.","PROD-4820: a Redis cancel if the tender is not received within 20 seconds is being added.","PROD-4980: tip refused by the issuer, a repeat of POS-11195."]},"Adyen/Payments::Payment terminal/hardware failures":{"name":"Payment terminal and hardware failures","parent":"Adyen/Payments","summary":"Terminals that will not power on, will not charge, or drop offline. Hardware faults go to Adyen as warranty claims; kiosk card failures are not fully explained.","steps":[{"t":"Card tap or insert","s":"Customer"},{"t":"Adyen terminal","s":"Power, charge"},{"t":"Network","s":"Wi-Fi"},{"t":"POS or kiosk","s":"Pairing"}],"fails":[{"id":"Adyen/Payments::Payment terminal/hardware failures#0","label":"Terminal will not power on or charge (hardware, warranty)","frm":1,"to":2},{"id":"Adyen/Payments::Payment terminal/hardware failures#1","label":"POS payment failed every morning until restarted","frm":2,"to":3},{"id":"Adyen/Payments::Payment terminal/hardware failures#2","label":"Kiosk card payments failed or were unresponsive","frm":2,"to":3}],"causes":["PROD-4881, 4891: a hardware fault; opening the terminal voids the warranty, so it is raised with Adyen.","PROD-5039: terminals not on the Pacific timezone fail each morning; the fix needs the restaurant’s own timezone.","PROD-4974, 4965: the terminal was briefly unresponsive; closed as non-issue while monitoring."]},"Adyen/Payments::Apple Pay failures":{"name":"Apple Pay failures","parent":"Adyen/Payments","summary":"Apple Pay taps do not complete at four restaurants. All four are waiting on Adyen.","steps":[{"t":"Customer taps","s":"Apple Pay"},{"t":"Adyen terminal","s":"Contactless"},{"t":"Adyen authorisation","s":"Auth code"},{"t":"Decline","s":"Limit exceeded"}],"fails":[{"id":"Adyen/Payments::Apple Pay failures#0","label":"Contactless limit exceeded, tap never finishes (waiting on Adyen)","frm":1,"to":3}],"causes":["PROD-4662: Adyen returns auth code 65 (gateway issue), then the device attempts a chip fallback that Apple Pay cannot do.","PROD-4799: the same error again at rush hour; the thread says two months without an update."]},"Adyen/Payments::Payment succeeded, but status shows unpaid":{"name":"Payment succeeded but ticket shows unpaid","parent":"Adyen/Payments","summary":"The card was charged but the ticket stays unclosed or the voided ticket is paid.","steps":[{"t":"Card captured","s":"Adyen"},{"t":"Webhook","s":"Status update"},{"t":"Ticket","s":"Paid or unclosed"}],"fails":[{"id":"Adyen/Payments::Payment succeeded, but status shows unpaid#0","label":"Manual capture in Adyen did not update the ticket","frm":1,"to":2},{"id":"Adyen/Payments::Payment succeeded, but status shows unpaid#1","label":"Capture arrived after the ticket was voided","frm":1,"to":2}],"causes":["PROD-4709: a capture done manually in the Adyen dashboard only changes capture status; the ticket marks as paid when a tip is added.","PROD-4957: no webhook retries were attempted for the capture."]},"Adyen/Payments::Stale device state":{"name":"Stale terminal state","parent":"Adyen/Payments","summary":"The POS keeps an old state for the terminal, so card payment is unavailable until a reboot.","steps":[{"t":"Terminal","s":"Offline then back"},{"t":"MQTT event","s":"Initialised or Shutdown"},{"t":"POS","s":"Marks terminal state"},{"t":"Pay by card","s":"Option shown"}],"fails":[{"id":"Adyen/Payments::Stale device state#0","label":"POS missed the terminal state change (Initialised or Shutdown event)","frm":1,"to":2}],"causes":["PROD-4718: Adyen reported the terminal offline, then back with an Initialised MQTT event that the POS did not handle.","PROD-4706: the POS ignored a correctly published Shutdown MQTT."]},"Adyen/Payments::Double charge":{"name":"Double charge","parent":"Adyen/Payments","summary":"One ticket: a restaurant was charged double processing rates.","steps":[{"t":"Payment","s":"Card fee lookup"},{"t":"Fee table","s":"Fixed fee"},{"t":"Statement","s":"Rate charged"}],"fails":[{"id":"Adyen/Payments::Double charge#0","label":"Two rate sets picked up for a tenant with two locations","frm":1,"to":2}],"causes":["PROD-4929: restaurantId is missing from the fixed-fee lookup for mPOS and POS payments."]},"Adyen/Payments::Stuck payment intent":{"name":"Stuck payment intent","parent":"Adyen/Payments","summary":"One ticket: a kiosk refund stayed Initiated and a ghost ticket reverted to Paid.","steps":[{"t":"Kiosk payment","s":"Card"},{"t":"Refund","s":"Initiated"},{"t":"Webhook","s":"Adyen confirms"},{"t":"Ticket","s":"Status"}],"fails":[{"id":"Adyen/Payments::Stuck payment intent#0","label":"Refund stuck in Initiated although Adyen had finished it","frm":2,"to":3}],"causes":["PROD-4674: Adyen concluded the refund and sent its webhook, but the ghost ticket exists only on the AIO side."]},"Adyen/Payments::None":{"name":"Adyen/Payments (sub-area not set)","parent":"Adyen/Payments","summary":"These six Adyen bugs have no sub-area; they are authorisations that did not capture.","steps":[{"t":"Payment","s":"Card"},{"t":"Adyen authorisation","s":"Webhook"},{"t":"Capture","s":"Closeout"}],"fails":[{"id":"Adyen/Payments::None#0","label":"Transactions stuck on Authorized, not captured","frm":1,"to":2}],"causes":["PROD-5085, 5065: the tickets were left unclosed and moved to the next day at auto-closeout, so the restaurant has to close them from the POS.","See also Transactions stuck on Authorised."]},"Mpos::Data Sync Issue":{"name":"mPOS data sync","parent":"Mpos","summary":"mPOS paid with a stale local menu or tax after a menu publish, leaving a phantom remaining balance.","steps":[{"t":"Menu publish","s":"Dashboard"},{"t":"refetch-menu","s":"MQTT event"},{"t":"mPOS","s":"Local menu and tax"},{"t":"Pay","s":"Remaining balance"}],"fails":[{"id":"Mpos::Data Sync Issue#0","label":"mPOS missed the menu refetch while backgrounded","frm":1,"to":2}],"causes":["PROD-4927, 4906: mPOS could miss the MQTT refetch-menu while backgrounded or with a stale Firebase heartbeat; fix refetches after 5 minutes.","PROD-4960: mPOS2 paid using a pre-publish local menu."]},"Mpos::Ticket Level Discount":{"name":"mPOS ticket-level discount","parent":"Mpos","summary":"Three Flights Vegas tickets flagged by the calculator. The HGV discount excludes categories, so these close as non-issue.","steps":[{"t":"Ticket","s":"Items"},{"t":"Discount","s":"HGV"},{"t":"Payment","s":"Paid"},{"t":"NAT calculator","s":"Compare"}],"fails":[{"id":"Mpos::Ticket Level Discount#0","label":"Calculator flags a discount that excludes categories","frm":1,"to":3}],"causes":["PROD-4801, 4802: another category was added to the exclusion list, changing item prices."]},"Mpos::Payments":{"name":"mPOS payments","parent":"Mpos","summary":"Tap to Pay payments stall on Processing Payment, do not accept taps, or skip the tip screen.","steps":[{"t":"Pay","s":"mPOS"},{"t":"Tap to Pay SDK","s":"Adyen"},{"t":"Processing screen","s":"Approval"}],"fails":[{"id":"Mpos::Payments#0","label":"Stuck on Processing Payment (over 30 seconds)","frm":1,"to":2},{"id":"Mpos::Payments#1","label":"Card tapping fails on one device (not reproduced)","frm":1,"to":1},{"id":"Mpos::Payments#2","label":"Pay by card closed without the tip screen and the ticket came back unpaid","frm":1,"to":2}],"causes":["PROD-5074: a ticket took more than 30 seconds on the Tap to Pay SDK.","PROD-5091: the audit logs show one payment attempt; the second payment on the receipt (different card) was not found in Adyen."]},"Mpos::None":{"name":"mPOS (sub-area not set)","parent":"Mpos","summary":"One ticket: paid tickets showed as unpaid because the device’s payment source was set to Stripe, not Adyen.","steps":[{"t":"Dashboard","s":"Payment source"},{"t":"mPOS","s":"Pay"},{"t":"Ticket","s":"Status"}],"fails":[{"id":"Mpos::None#0","label":"Payment source configured as Stripe instead of Adyen","frm":0,"to":1}],"causes":["PROD-5076: the device’s payment source was configured as Stripe in the dashboard."]},"Mpos::Payment Amount Discrepancy":{"name":"mPOS payment amount discrepancy","parent":"Mpos","summary":"One ticket: a chec function spills(b){
 return '<div class="pillrow">'+BORDER.map(function(k){return '<span class="spill"><span class="dot" style="--c:'+BK[k].color+'"></span>'+BK[k].name+' <b>'+b[k]+'</b></span>';}).join('')+'</div>';
}
function flowModule(d){
 var sm=selMod();
 var title=sm===null?'All modules':(sm==='*'?'Selected modules':sm);
 var par={};
 Object.keys(d.keys).forEach(function(k){var p=k.split('::')[0];(par[p]=par[p]||[]).push(d.keys[k]);});
 var plist=Object.keys(par).sort(function(a,b){var sa=0,sb=0;par[a].forEach(function(x){sa+=x.rows.length;});par[b].forEach(function(x){sb+=x.rows.length;});return sb-sa;});
 var nsub=Object.keys(d.keys).length;
 var h='<div class="fhead"><div><h2>'+esc(title)+'</h2><p>'+d.rows.length+' bug'+(d.rows.length===1?'':'s')+' across '+nsub+' sub-area'+(nsub===1?'':'s')+', '+openCount(d.rows)+' not resolved. Sub-areas come from each ticket’s Product field. Open one to see its flow and where the bugs occurred.</p></div>'+spills(d.b)+'</div>';
 if(!d.rows.length)return h+'<div class="card"><div class="empty">No bugs match the current filters.</div></div>';
 plist.forEach(function(p){
  var list=par[p].slice().sort(function(a,b){return b.rows.length-a.rows.length;});
  var tot=0;list.forEach(function(x){tot+=x.rows.length;});
  h+='<div class="card"><h3>'+esc(FD.disp[p]||p||'Product not set')+' <span class="tag">'+tot+' bug'+(tot===1?'':'s')+'</span></h3>';
  list.forEach(function(x){
   var o=openCount(x.rows);
   h+='<button class="subrow" data-fsub="'+esc(x.key)+'"><span class="c">'+x.rows.length+'</span><span class="body"><span class="l">'+esc(subName(x.key))+'</span>'+miniBar({resolved:x.b.resolved,progress:x.b.progress,new:x.b.new,roadmap:x.b.roadmap,total:x.rows.length})+'</span><span class="o">'+(o?o+' not resolved':'all resolved')+'</span></button>';
  });
  h+='</div>';
 });
 return h;
}
function flowSub(d){
 var key=st.fsub,x=d.keys[key]||{key:key,rows:[],b:newBk(),f:{}},sub=getSub(key);
 var sm=selMod();
 var h='<button class="link back" data-fback="1">‹ Back to '+esc(sm===null?'all modules':(sm==='*'?'selected modules':sm))+'</button>';
 h+='<div class="fhead"><div><h2>'+esc(sub.name)+'<span class="tag">'+esc(parentName(key))+'</span></h2><p>'+esc(sub.summary)+'</p></div>'+spills(x.b)+'</div>';
 h+='<div class="card flowcard"><div class="flow">';
 var oth=x.f._other&&x.f._other.length;
 sub.steps.forEach(function(s,i){
  h+='<div class="fnode"><b>'+esc(s.t)+'</b>'+(s.s?'<span>'+esc(s.s)+'</span>':'')+'</div>';
  var fs=sub.fails.filter(function(f){return f.frm===i&&x.f[f.id]&&x.f[f.id].length;});
  var last=i===sub.steps.length-1;
  var extra=last&&oth;
  if(last&&!fs.length&&!extra)return;
  h+='<div class="gap'+((fs.length||extra)?' has':'')+(last?' last':'')+'">';
  fs.forEach(function(f,k){
   var n=x.f[f.id].length,left=k%2===0,lab='<div class="'+(left?'fl':'fr')+'">'+esc(f.label)+'</div>';
   h+='<div class="frow">'+(left?lab:'<div></div>')+'<button class="fpill" data-ffail="'+esc(f.id)+'" aria-pressed="'+(st.ffail===f.id)+'">'+n+' ticket'+(n===1?'':'s')+'</button>'+(left?'<div></div>':lab)+'</div>';
  });
  if(extra){h+='<div class="frow"><div class="fl">Not yet placed at a failure point</div><button class="fpill" data-ffail="_other" aria-pressed="'+(st.ffail==='_other')+'">'+oth+' ticket'+(oth===1?'':'s')+'</button><div></div></div>';}
  h+='</div>';
 });
 h+='</div>';
 if(!x.rows.length)h+='<div class="empty">No bugs in this sub-area for the current filters.</div>';
 
 if(sub.causes.length)h+='<div class="causes"><h3>Root causes (from RCAs)</h3><ul>'+sub.causes.map(function(s){return '<li>'+linkRefs(s)+'</li>';}).join('')+'</ul></div>';
 h+='</div>';
 var list=st.ffail?(x.f[st.ffail]||[]):x.rows;
 list=list.slice().sort(function(a,b){return a.c<b.c?1:a.c>b.c?-1:(+b.n)-(+a.n);});
 h+='<div class="card"><h2>'+(st.ffail?esc(failLabelSub(sub,st.ffail)):'All bugs in this sub-area')+'</h2>';
 h+='<div class="fsel"><span class="sub" style="margin:0">'+list.length+' bug'+(list.length===1?'':'s')+', newest first</span>'+(st.ffail?'<button class="link" data-fclear="1">Show all failure points</button>':'')+'</div>';
 if(!list.length)h+='<div class="empty">Nothing to show.</div>';
 else{
  h+='<div class="rows">';
  list.slice(0,st.limit).forEach(function(r){
   var s=SBN[r.s];
   h+='<div class="row"><div class="k"><a href="'+JIRA_BASE+esc(r.n)+'" target="_blank" rel="noopener">PROD-'+esc(r.n)+'</a></div><div><div class="t">'+esc(r.t)+'</div><div class="m"><span class="fpl">'+esc(failLabelSub(sub,r.f))+'</span>'+prBadge(r.p)+'<span>Module: '+esc(r.m.join(', '))+'</span><span>Created '+fmtD(r.c)+'</span></div>'+(r.rc?'<div class="why">Why: '+esc(r.rc)+'</div>':'')+'</div><div class="s"><span class="st" style="--c:'+s.c+'"><span class="dot"></span>'+esc(s.short)+'</span></div></div>';
  });
  h+='</div>';
  if(list.length>st.limit)h+='<div class="more"><button class="btn" data-more="1">Show '+Math.min(100,list.length-st.limit)+' more</button></div>';
 }
 return h+'</div>';
}
var FCACHE=null;
function renderFlows(){
 var d=flowData();FCACHE=d;
 renderFlowSide();
 $('fmain').innerHTML=st.fsub?flowSub(d):flowModule(d);
 var sm=selMod();
 var n=st.fsub?(d.keys[st.fsub]?d.keys[st.fsub].rows.length:0):d.rows.length;
 $('sub').textContent=n+' bug'+(n===1?'':'s')+' created '+fmtD(st.from)+' – '+fmtD(st.to)+(sm===null?'':' · '+(sm==='*'?'selected modules':sm))+(st.fsub?' · '+subName(st.fsub):'');
}
function renderView(){
 var f=st.view==='flows';
 $('ticketview').hidden=f;$('flowview').hidden=!f;
 $('typeseg').style.display=f?'none':'';
 $('viewseg').innerHTML=[['tickets','Ticket explorer'],['flows','Flow analysis']].map(function(v){return '<button data-view="'+v[0]+'" aria-pressed="'+(st.view===v[0])+'">'+v[1]+'</button>';}).join('');
 $('viewhint').textContent=f?'Bugs only. Feature requests are in the ticket explorer.':'';
}
function renderAll(){hideTip(true);renderPresets();renderTypeSeg();renderChips();renderModChips();if(st.view==='flows'){renderFlows();}else{renderSide();renderMain();}renderSrc();renderView();}


/* ---------- live Jira via claude.ai connector ---------- */
function unwrap(p){
 try{
  if(typeof p==='string')return JSON.parse(p);
  if(Array.isArray(p)&&p.length&&p[0]&&typeof p[0].text==='string'&&p[0].id===undefined)return JSON.parse(p[0].text);
 }catch(e){}
 return p;
}
function payloadOf(res){
 var p=res&&res.payload;
 if(p===undefined&&res&&res.content&&res.content[0])p=res.content[0].text;
 return unwrap(p);
}
function errText(e){
 var c=e&&e.code;
 if(c==='needs_reauth')return 'Your Atlassian connection needs to be reconnected: claude.ai → Settings → Connectors. Showing the saved snapshot meanwhile.';
 if(c==='server_not_connected'||c==='server_not_found'||c==='selection_required')return 'The Atlassian connector isn’t available for this viewer. Add or select it in claude.ai → Settings → Connectors. Showing the saved snapshot meanwhile.';
 if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return 'Access to Atlassian wasn’t allowed for this page. Press Refresh from Jira and allow it when asked. Showing the saved snapshot meanwhile.';
 if(c==='blocked_by_policy')return 'Your organization’s policy blocks this Jira query. Showing the saved snapshot meanwhile.';
 if(c==='tool_error')return 'Jira returned an error: '+String(e.message||'').slice(0,160)+'. Showing the saved snapshot meanwhile.';
 if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed'||c==='unavailable')return 'Live Jira data isn’t available in this view, so the saved snapshot is shown. Open the page inside claude.ai to refresh.';
 if(c==='server_unavailable'||c==='upstream_error')return 'Jira didn’t respond. Try Refresh again in a moment. Showing the saved snapshot meanwhile.';
 return 'Couldn’t load live data ('+(c||'unknown error')+'). Showing the saved snapshot meanwhile.';
}
var refreshing=false;
async function fetchLive(from,to){
 var mcp=await claude.use('mcp');
 if(!mcp)throw {code:'unavailable'};
 var tool='searchJiraIssuesUsingJql';
 try{
  var lt=await mcp.listTools(SERVER);
  var srv=lt&&lt.servers&&lt.servers[0];
  if(!srv||!srv.tools||!srv.tools.length)throw {code:'server_not_connected'};
  if(!srv.tools.some(function(t){return t.name===tool;})){
   var alt=srv.tools.filter(function(t){return /searchJiraIssues/i.test(t.name);})[0];
   if(!alt)throw {code:'tool_error',message:'search tool not found on connector'};
   tool=alt.name;
  }
 }catch(e){if(e&&e.code)throw e;}
 var res=await mcp.callTool(SERVER,'getAccessibleAtlassianResources',{});
 var sites=payloadOf(res);
 if(!Array.isArray(sites)||!sites.length)throw {code:'tool_error',message:'no Jira site found'};
 var site=sites.filter(function(s){return /aioapp/i.test(s.url||'');})[0]||sites[0];
 var jql='project = PROD AND created >= "'+from+'" AND created < "'+addDays(to,1)+'" ORDER BY created DESC';
 var out=[],token,page=0;
 while(page<15){
  var input={cloudId:site.id,jql:jql,fields:['summary','status','created','issuetype','priority','customfield_10348','customfield_11195'],maxResults:100};
  if(token)input.nextPageToken=token;
  var r=await mcp.callTool(SERVER,tool,input,{cache:false});
  var d=payloadOf(r);
  if(!d||!Array.isArray(d.issues))throw {code:'tool_error',message:'unexpected response shape'};
  d.issues.forEach(function(i){
   var f=i.fields||{},s=f.status||{};
   out.push(prep({k:i.key,t:f.summary,s:s.name||'Unknown',cat:s.statusCategory&&s.statusCategory.key,ty:(f.issuetype&&f.issuetype.name==='Bug')?'b':'f',p:f.priority&&f.priority.name,c:(f.created||'').slice(0,10),m:(f.customfield_10348||[]).map(function(x){return x&&x.value;}).filter(Boolean),pp:f.customfield_11195&&f.customfield_11195.value,pc:f.customfield_11195&&f.customfield_11195.child&&f.customfield_11195.child.value}));
  });
  page++;
  st.msg=null;$('src').textContent='Loading from Jira… '+out.length+' tickets';
  if(d.isLast||!d.nextPageToken)break;
  token=d.nextPageToken;
 }
 return out;
}
async function refresh(auto){
 if(refreshing)return;
 refreshing=true;st.busy=true;st.msg=null;renderSrc();
 var from=st.from,to=st.to;
 try{
  var out=await fetchLive(from,to);
  rows=out;S.forEach(function(s){if(st.sel[s.name]===undefined)st.sel[s.name]=true;});
  st.source='live';st.coverFrom=from;st.coverTo=to;
  var t=new Date();st.loadedAt=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
 }catch(e){
  st.msg=errText(e);st.msgErr=!(e&&(e.code==='not_granted'||e.code==='capability_disabled'||e.code==='unavailable'));
 }finally{
  refreshing=false;st.busy=false;st.limit=100;renderAll();
 }
}
function needsLoad(){return st.from<st.coverFrom||st.to>st.coverTo;}

/* ---------- hover cards ---------- */
var tipEl=$('tip'),tipTimer=null,tipFor=null;
function tipRows(el){
 if(!FCACHE||st.view!=='flows')return null;
 var key=el.hasAttribute('data-fsub')?el.getAttribute('data-fsub'):st.fsub;
 var x=FCACHE.keys[key];if(!x)return null;
 var sub=getSub(key),fid=el.getAttribute('data-ffail'),rs=fid?(x.f[fid]||[]):x.rows;
 return {label:fid?failLabelSub(sub,fid):sub.name,ctx:sub.name+' · '+parentName(key),rows:rs.slice().sort(function(a,b){return a.c<b.c?1:a.c>b.c?-1:(+b.n)-(+a.n);})};
}
function showTip(el){
 var d=tipRows(el);if(!d||!d.rows.length)return;
 clearTimeout(tipTimer);tipFor=el;
 var max=7,h='<div class="th">'+esc(d.label)+'</div><div class="ts">'+d.rows.length+' bug'+(d.rows.length===1?'':'s')+' · '+openCount(d.rows)+' not resolved · '+esc(d.ctx)+'</div>';
 d.rows.slice(0,max).forEach(function(r){
  var s=SBN[r.s];
  h+='<div class="ti"><a href="'+JIRA_BASE+esc(r.n)+'" target="_blank" rel="noopener">'+esc(r.n)+'</a><div class="tt" title="'+esc(r.t)+'">'+esc(r.t)+'</div><div class="tm"><span class="st" style="--c:'+s.c+'"><span class="dot"></span>'+esc(s.short)+'</span>'+prBadge(r.p)+'<span>'+esc(prodLabel(r))+'</span><span>'+esc(r.m.join(', '))+'</span></div>'+(r.rc?'<div class="tw">'+esc(r.rc)+'</div>':'')+'</div>';
 });
 if(d.rows.length>max)h+='<div class="tf">+'+(d.rows.length-max)+' more. Click to list them all below.</div>';
 tipEl.innerHTML=h;tipEl.hidden=false;tipEl.style.visibility='hidden';tipEl.style.left='0px';tipEl.style.top='0px';
 var rc=el.getBoundingClientRect(),tw=tipEl.offsetWidth,th=tipEl.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
 var left=Math.max(8,Math.min(rc.left+rc.width/2-tw/2,vw-tw-8));
 var top=rc.bottom+8;if(top+th>vh-8){top=Math.max(8,rc.top-th-8);}
 tipEl.style.left=left+'px';tipEl.style.top=top+'px';tipEl.style.visibility='visible';
}
function hideTip(now){
 clearTimeout(tipTimer);
 if(now){tipEl.hidden=true;tipFor=null;return;}
 tipTimer=setTimeout(function(){tipEl.hidden=true;tipFor=null;},160);
}
document.addEventListener('mouseover',function(e){
 var el=e.target.closest&&e.target.closest('.fpill,.subrow');
 if(el){if(el!==tipFor)showTip(el);else clearTimeout(tipTimer);}
});
document.addEventListener('mouseout',function(e){
 var el=e.target.closest&&e.target.closest('.fpill,.subrow');
 if(el&&!(e.relatedTarget&&tipEl.contains(e.relatedTarget)))hideTip(false);
});
tipEl.addEventListener('mouseenter',function(){clearTimeout(tipTimer);});
tipEl.addEventListener('mouseleave',function(){hideTip(false);});
document.addEventListener('focusin',function(e){var el=e.target.closest&&e.target.closest('.fpill,.subrow');if(el)showTip(el);});
document.addEventListener('focusout',function(e){var el=e.target.closest&&e.target.closest('.fpill,.subrow');if(el)hideTip(false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){hideTip(true);if(st.ddOpen){st.ddOpen=false;renderChips();}}});
document.addEventListener('mousedown',function(e){if(st.ddOpen&&!(e.target.closest&&e.target.closest('#chips'))){st.ddOpen=false;renderChips();}});
window.addEventListener('scroll',function(){hideTip(true);},{passive:true});

/* ---------- events ---------- */
function setRange(f,t){
 if(!f||!t)return;
 if(f>DEFAULT_TO)f=DEFAULT_TO;
 if(t>DEFAULT_TO)t=DEFAULT_TO;
 if(f>t){var x=f;f=t;t=x;}
 st.from=f;st.to=t;st.limit=100;st.msg=null;
 $('from').value=f;$('to').value=t;
 renderAll();
 if(needsLoad()&&!st.busy)refresh(true);
}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-preset],[data-type],[data-status],[data-status-all],[data-area],[data-bucket],[data-more],[data-mod],[data-mod-clear],[data-dd],[data-view],[data-fmod],[data-fsub],[data-fback],[data-ffail],[data-fclear]');
 if(!t)return;
 if(t.hasAttribute('data-preset')){var p=PRESETS.filter(function(x){return x.id===t.getAttribute('data-preset');})[0];var v=p.get();setRange(v[0],v[1]);return;}
 if(t.hasAttribute('data-type')){st.type=t.getAttribute('data-type');st.limit=100;renderAll();return;}
 if(t.hasAttribute('data-status')){var n=t.getAttribute('data-status');st.sel[n]=!st.sel[n];st.limit=100;renderAll();return;}
 if(t.hasAttribute('data-status-all')){var on=t.getAttribute('data-status-all')==='all';S.forEach(function(s){st.sel[s.name]=on;});renderAll();return;}
 if(t.hasAttribute('data-area')){st.area=t.getAttribute('data-area');st.limit=100;renderAll();return;}
 if(t.hasAttribute('data-bucket')){var b=t.getAttribute('data-bucket')||null;st.bucket=(st.bucket===b)?null:b;st.limit=100;renderMain();return;}
 if(t.hasAttribute('data-mod')){var mm=t.getAttribute('data-mod');st.mods[mm]=!st.mods[mm];st.limit=100;renderAll();return;}
 if(t.hasAttribute('data-mod-clear')){st.mods={};st.limit=100;renderAll();return;}
 if(t.hasAttribute('data-dd')){st.ddOpen=!st.ddOpen;renderChips();return;}
 if(t.hasAttribute('data-view')){st.view=t.getAttribute('data-view');st.limit=100;renderAll();return;}
 if(t.hasAttribute('data-fmod')){var fm=t.getAttribute('data-fmod');st.mods=(fm==='all')?{}:(function(){var o={};o[fm]=true;return o;})();st.fsub=null;st.ffail=null;st.limit=100;renderAll();return;}
 if(t.hasAttribute('data-fsub')){st.fsub=t.getAttribute('data-fsub');st.ffail=null;st.limit=100;renderAll();window.scrollTo({top:0});return;}
 if(t.hasAttribute('data-fback')){st.fsub=null;st.ffail=null;st.limit=100;renderAll();window.scrollTo({top:0});return;}
 if(t.hasAttribute('data-ffail')){var ff=t.getAttribute('data-ffail');st.ffail=(st.ffail===ff)?null:ff;st.limit=100;renderAll();return;}
 if(t.hasAttribute('data-fclear')){st.ffail=null;st.limit=100;renderAll();return;}
 if(t.hasAttribute('data-more')){st.limit+=100;renderMain();return;}
});
$('from').addEventListener('change',function(){setRange(this.value,$('to').value);});
$('to').addEventListener('change',function(){setRange($('from').value,this.value);});
$('refresh').addEventListener('click',function(){refresh(false);});
$('mobsel').addEventListener('change',function(){st.area=this.value;st.limit=100;renderAll();});
$('fmobsel').addEventListener('change',function(){var v=this.value;st.mods=v==='all'?{}:(function(){var o={};o[v]=true;return o;})();st.fsub=null;st.ffail=null;st.limit=100;renderAll();});
$('q').addEventListener('input',function(){st.q=this.value.trim().toLowerCase();st.limit=100;renderAll();});

$('from').max=DEFAULT_TO;$('to').max=DEFAULT_TO;$('from').value=st.from;$('to').value=st.to;
renderAll();
if(needsLoad()){setTimeout(function(){refresh(true);},0);}
})();
</script>
