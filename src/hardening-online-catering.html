<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>AIO Ordering Paths and Errors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #F3F5F8; --surface: #FFFFFF; --soft: #F7F8FA; --ink: #18212C; --muted: #5C6674; --faint: #8D96A3; --line: #DFE3E9;
  --accent: #5640D2; --accent-soft: #EEEBFD;
  --cust: #C94F83; --softw: #2E68AC; --int: #B08714; --dec: #6B7480; --term: #2F7D52;
  --C: #C6342C; --H: #D9731F; --M: #C49B22; --L: #98A1AD; --C-soft: #FCECEB;
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #13171D; --surface: #1B2129; --soft: #20262F; --ink: #E7EBF0; --muted: #A2ACB8; --faint: #77818E; --line: #2D3540;
    --accent: #A391FF; --accent-soft: #29234A;
    --cust: #E482AD; --softw: #73A9E6; --int: #DDB650; --dec: #A2ACB8; --term: #6DC394;
    --C: #F06A61; --H: #F09A50; --M: #E0C05C; --L: #7E8895; --C-soft: #3A2022;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #13171D; --surface: #1B2129; --soft: #20262F; --ink: #E7EBF0; --muted: #A2ACB8; --faint: #77818E; --line: #2D3540;
  --accent: #A391FF; --accent-soft: #29234A;
  --cust: #E482AD; --softw: #73A9E6; --int: #DDB650; --dec: #A2ACB8; --term: #6DC394;
  --C: #F06A61; --H: #F09A50; --M: #E0C05C; --L: #7E8895; --C-soft: #3A2022;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }

header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 28px 0; }
.chan { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 14px; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; }
.chan button { border: 0; background: none; padding: 7px 18px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.chan button:hover { color: var(--ink); }
.chan button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
h1 { margin: 0; font-size: 1.4rem; line-height: 1.2; letter-spacing: -0.01em; }
#sum { margin: 4px 0 14px; color: var(--muted); font-size: 0.92rem; }
.bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 24px; }
.tabs { display: flex; gap: 22px; }
.tabs button { border: 0; background: none; padding: 8px 0 10px; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 700; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
.pathpick { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
.pathpick label { font-size: 0.86rem; color: var(--muted); white-space: nowrap; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 10px; min-width: 260px; max-width: 70vw; }
#clear { border: 0; background: none; color: var(--accent); font-size: 0.88rem; padding: 4px 2px; }
.key { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 14px; padding-bottom: 12px; font-size: 0.8rem; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.kd { width: 10px; height: 10px; border-radius: 2px; display: inline-block; background: var(--dec); }
.k-cust.kd { background: var(--cust); } .k-soft.kd { background: var(--softw); } .k-int.kd { background: var(--int); } .k-term.kd { background: var(--term); }

main { display: grid; grid-template-columns: 1fr; min-height: 0; }
body.open main { grid-template-columns: 1fr 420px; }
.scroll { overflow: auto; min-height: 0; padding: 20px 28px 60px; }

.stage { display: grid; grid-template-columns: 220px 1fr; gap: 20px; padding: 18px 0; border-top: 1px solid var(--line); transition: opacity .15s; }
.stage:first-child { border-top: 0; padding-top: 4px; }
.stage.faded { opacity: 0.4; }
.stage-head h2 { margin: 0; font-size: 1rem; line-height: 1.3; }
.sid { color: var(--accent); margin-right: 8px; }
.stage-head p { margin: 4px 0 0; font-size: 0.84rem; color: var(--muted); }
.stage-head .sstat { color: var(--faint); font-size: 0.8rem; }
.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; }
.card { position: relative; width: 100%; height: 100%; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 11px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: inset 3px 0 0 var(--dec); transition: border-color .12s, opacity .15s; }
.card.k-cust { box-shadow: inset 3px 0 0 var(--cust); } .card.k-soft { box-shadow: inset 3px 0 0 var(--softw); }
.card.k-int { box-shadow: inset 3px 0 0 var(--int); } .card.k-term { box-shadow: inset 3px 0 0 var(--term); }
.card:hover { border-color: var(--faint); }
.card.dim { opacity: 0.35; }
.card.on { border-color: var(--accent); }
.card.sel { border-color: var(--ink); border-width: 2px; padding: 9px 11px 10px 13px; }
.top { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--faint); font-weight: 700; }
.rel { color: var(--accent); }
.ct { font-weight: 700; font-size: 0.93rem; line-height: 1.3; flex: 1; }
.ce { font-size: 0.8rem; color: var(--muted); }
.ce b { color: var(--C); margin-left: 8px; }
.num { position: absolute; top: -9px; left: -7px; background: var(--accent); color: #fff; font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 1px 7px; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#drawer { overflow: auto; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); padding: 20px 22px 50px; position: relative; }
.x { position: absolute; top: 12px; right: 12px; border: 0; background: none; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; }
.x:hover { background: var(--soft); }
.back { border: 0; background: none; color: var(--accent); padding: 0; margin-bottom: 10px; font-size: 0.86rem; }
.kicker { margin: 0 36px 4px 0; font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 7px; }
#drawer h2 { margin: 0 36px 6px 0; font-size: 1.25rem; line-height: 1.25; }
.desc { margin: 0; color: var(--muted); font-size: 0.92rem; }
#drawer h3 { font-size: 0.95rem; margin: 22px 0 8px; }
.errs { list-style: none; margin: 0; padding: 0; }
.errs li { padding: 8px 0 8px 12px; border-left: 3px solid var(--L); margin-bottom: 6px; }
.errs li.sev-C { border-color: var(--C); } .errs li.sev-H { border-color: var(--H); } .errs li.sev-M { border-color: var(--M); }
.sv { font-size: 0.74rem; font-weight: 700; color: var(--muted); }
.sev-C .sv { color: var(--C); } .sev-H .sv { color: var(--H); }
.et { margin: 1px 0 2px; font-weight: 700; font-size: 0.9rem; line-height: 1.35; }
.ei { margin: 0; font-size: 0.85rem; color: var(--muted); }
.bn { color: var(--faint); }
.nav { list-style: none; margin: 0; padding: 0; }
.nav button { width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 8px; font-size: 0.9rem; }
.nav button:hover { background: var(--soft); }
.nav button span { display: block; font-size: 0.8rem; color: var(--muted); }
details { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; }
.lbl { margin: 14px 0 4px; font-size: 0.8rem; font-weight: 700; color: var(--faint); }
details .muted { margin: 0; font-size: 0.86rem; }
.stats { display: flex; gap: 18px; margin: 12px 0 0; font-size: 0.86rem; color: var(--muted); }
.stats b { color: var(--ink); font-size: 1.15rem; margin-right: 3px; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps button { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 6px; border-radius: 8px; font-size: 0.9rem; }
.steps button:hover { background: var(--soft); }
.steps .i { color: var(--faint); text-align: right; }
.steps .n { color: var(--muted); font-size: 0.82rem; }

.ebar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
#q { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; width: min(320px, 100%); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 0.84rem; }
.chip span { color: var(--muted); margin-left: 3px; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.ebar p { margin: 0; font-size: 0.88rem; }
.twrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 640px; font-size: 0.9rem; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
thead th { font-size: 0.8rem; color: var(--muted); position: sticky; top: 0; background: var(--surface); }
tr.grp th { background: var(--soft); font-size: 0.92rem; }
tr[data-node] { cursor: pointer; } tr[data-node]:hover { background: var(--soft); }
.tstep { font-weight: 700; width: 210px; }
.pill { font-size: 0.78rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.pill.sev-C { color: var(--C); } .pill.sev-H { color: var(--H); }

@media (max-width: 1100px) {
  body.open main { grid-template-columns: 1fr; }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 94vw); z-index: 10; box-shadow: -10px 0 40px rgba(0,0,0,.18); padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .stage { grid-template-columns: 1fr; gap: 10px; }
}
@media (max-width: 640px) {
  header { padding: 14px 16px 0; } .scroll { padding: 14px 16px 50px; }
  h1 { font-size: 1.15rem; }
  .key { display: none; }
  select { min-width: 0; width: 100%; }
  .pathpick { width: 100%; }
  .cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  #drawer { top: auto; height: 72vh; width: 100%; border-left: 0; border-radius: 16px 16px 0 0; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

<header>
  <div class="chan" role="tablist" aria-label="Channel">
    <button role="tab" data-ch="online">Online ordering</button>
    <button role="tab" data-ch="catering">Catering</button>
  </div>
  <h1 id="ttl">Online ordering: customer paths and what can go wrong</h1>
  <p id="sum"></p>
  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="journey">Journey</button>
      <button role="tab" data-tab="errors">All errors</button>
    </div>
    <div class="pathpick">
      <label for="path">Trace a path</label>
      <select id="path"></select>
      <button id="clear" data-act="clear">Clear</button>

    </div>

</header>
<main>

    <div id="journey"></div>
    <div id="errors" hidden></div>

  <aside id="drawer" hidden aria-live="polite"></aside>
</main>

   "s": "A1 A2 B1 B2 B5 C1 C2 C3 D1 D7 E1 E8 E9 F1 F11 F3 F5 F6 F7 F13 F8 F10 G1 G2 G5 G7 H1 H8 H5 I1 I5 I6 I5 H5 H7 I4",
   "side": "H2"
  },
  {
   "id": "Q13",
   "g": 3,
   "t": "Restaurant cancels and refunds",
   "n": "Full refund, no policy tiers.",
   "s": "A1 A2 B1 B2 B5 C1 C2 C3 D1 D7 E1 E8 E9 F1 F11 F3 F5 F6 F7 F13 F8 F10 G1 G2 G5 G7 H1 H8 H5 H10 I1 I4",
   "side": "H3"
  },
  {
   "id": "P01",
   "g": 4,
   "t": "Single pre-built package, declined",
   "n": "Inquiry submitted and declined by the restaurant.",
   "s": "A1 A2 A3 A5 J1 J2 J3 J5 J6 K1 K2 K3 K5 K6 L1 L2",
   "side": ""
  },
  {
   "id": "P02",
   "g": 4,
   "t": "Customised packages, deposit and final invoice",
   "n": "Two packages, accepted, paid in two invoices, reviewed.",
   "s": "A1 A2 A3 A5 J1 J2 J3 J4 J5 J6 J1 J2 J3 J4 J5 J6 K1 K2 K3 K5 K6 L1 L3 M1 M2 M1 M2 M5 N1 N2 N3 N5",
   "side": ""
  },
  {
   "id": "P03",
   "g": 4,
   "t": "Payment link expires, new invoice sent",
   "n": "Invoice voided with reason expired.",
   "s": "A1 A2 A3 A5 J1 J2 J3 J5 J6 K1 K2 K3 K5 K6 L1 L3 M1 M3 M1 M2 M5 N1 N2 N3 N5",
   "side": ""
  },
  {
   "id": "P04",
   "g": 4,
   "t": "Order edited after an invoice was sent",
   "n": "Unpaid invoice voided and regenerated.",
   "s": "A1 A2 A3 A5 J1 J2 J3 J5 J6 K1 K2 K3 K5 K6 L1 L3 M1 M4 M1 M2 M5 N1 N2 N3 N5",
   "side": ""
  },
  {
   "id": "P05",
   "g": 4,
   "t": "Tax-exempt event",
   "n": "Exemption details carried onto the WebDash inquiry.",
   "s": "A1 A2 A3 A5 J1 J2 J3 J5 J6 K1 K2 K3 K4 K5 K6 L1 L3 M1 M2 M5 N1 N2 N3 N5",
   "side": ""
  },
  {
   "id": "P06",
   "g": 4,
   "t": "Restaurant cancels the event",
   "n": "Unpaid invoices voided, deposit refunded by hand.",
   "s": "A1 A2 A3 A5 J1 J2 J3 J5 J6 K1 K2 K3 K5 K6 L1 L3 M1 M2 N4 N5",
   "side": ""
  },
  {
   "id": "P07",
   "g": 4,
   "t": "Tip given on the review page",
   "n": "No tip set at creation or on the final invoice.",
   "s": "A1 A2 A3 A5 J1 J2 J3 J5 J6 K1 B1 B2 B5 K2 K3 K5 K6 L1 L3 M1 M2 M5 N1 N2 N3 N5",
   "side": ""
  },
  {
   "id": "Q14",
   "g": 5,
   "t": "Catering turned off",
   "n": "Exit path. Unavailable state, no order possible.",
   "s": "A1 A2 A3 A4",
   "side": ""
  }
 ],
 "ORDER": {
  "G": "G1 G2 G3 G4 G5 G7 G6",
  "H": "H1 H8 H5 H9 H7 H2 H3 H10"
 }
};

// Each channel has its own map.
const CHANNELS = {
  online: { title: "Online ordering: customer paths and what can go wrong", data: { BANDS, NODES, EDGES, PATH_GROUPS, PATHS } },
  catering: { title: "Catering: customer paths and what can go wrong", data: CATERING }
};

(function () {
  const SEV = { C: "Critical", H: "High", M: "Medium", L: "Low" };
  const SO = { C: 0, H: 1, M: 2, L: 3 };
  const KIND = { cust: "Customer action", soft: "Software action", int: "Product integration", dec: "Decision", term: "Start or end" };
  const BUCKET = { M: "Math / Accounting", L: "Legal, Compliance", S: "Platform security", OB: "Onboarding, Offboarding", D: "Data storage", B: "Billing", R: "Reports", CN: "Consumptions", CX: "Customer experience", T: "Tech debt" };
  const REL = { R8: "Release 8", R9: "Release 9", TBC: "Unconfirmed for catering" };
  const ONLINE_ORDER = { G: "G1 G2 G3 G4 G5 G7 G6", H: "H1 H5 H7 H2 H3 H4 H6" };
  let ORDER = ONLINE_ORDER;

  let BANDS, NODES, EDGES, PATH_GROUPS, PATHS, N, B;
  Object.values(CHANNELS).forEach(c => c.data.PATHS.forEach(p => {
    p.seq = p.s.split(" ");
    p.sideIds = (p.side || "").split(" ").filter(Boolean);
    p.nodes = new Set(p.seq.concat(p.sideIds));
  }));
  const stepsOf = b => ORDER[b] ? ORDER[b].split(" ").map(id => N[id]) : NODES.filter(n => n.b === b);

  const st = { ch: "online", tab: "journey", path: null, sel: null, sev: { C: 1, H: 1, M: 1, L: 1 }, q: "" };
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pl = (k, w) => `${k} ${w}${k === 1 ? "" : "s"}`;
  const crit = n => n.e.filter(x => x[2] === "C").length;
  const curPath = () => st.path ? PATHS.find(p => p.id === st.path) : null;

  // ---------- journey ----------
  function renderJourney() {
    const P = curPath();
    let h = "";
    BANDS.forEach(b => {
      const steps = stepsOf(b.id);
      const errs = steps.reduce((a, n) => a + n.e.length, 0);
      const onPath = P && steps.some(n => P.nodes.has(n.id));
      h += `<section class="stage ${P && !onPath ? "faded" : ""}">
        <div class="stage-head"><h2><span class="sid">${b.id}</span>${esc(b.t)}</h2><p>${esc(b.s)}</p><p class="sstat">${pl(steps.length, "step")}, ${pl(errs, "error")}</p></div>
        <ol class="cards">`;
      steps.forEach(n => {
        const c = crit(n), on = P && P.nodes.has(n.id);
        let num = "";
        if (on) {
          const idx = P.seq.map((x, i) => x === n.id ? i + 1 : 0).filter(Boolean);
          num = `<span class="num" aria-label="Step ${idx.join(" and ") || "side effect"}">${idx.length ? idx.join(", ") : "+"}</span>`;
        }
        h += `<li><button class="card k-${n.k} ${P ? (on ? "on" : "dim") : ""} ${st.sel === n.id ? "sel" : ""}" data-node="${n.id}">
          ${num}<span class="top"><span class="cid">${n.k === "dec" ? "◆ " : ""}${n.id}</span>${n.rel !== "L" ? `<span class="rel">${n.rel}</span>` : ""}</span>
          <span class="ct">${esc(n.t)}</span>
          <span class="ce">${pl(n.e.length, "error")}${c ? `<b>${c} critical</b>` : ""}</span></button></li>`;
      });
      h += `</ol></section>`;
    });
    $("#journey").innerHTML = h;
  }

  // ---------- drawer ----------
  function errItems(list) {
    return `<ul class="errs">${list.slice().sort((a, b) => SO[a[2]] - SO[b[2]]).map(x => `<li class="sev-${x[2]}">
      <span class="sv">${SEV[x[2]]}</span><p class="et">${esc(x[0])}</p><p class="ei">${esc(x[1])}${x[4] ? `<span class="bn"> (from L1 board note)</span>` : ""}</p></li>`).join("")}</ul>`;
  }
  function renderDrawer() {
    const d = $("#drawer"), P = curPath();
    if (!st.sel && !P) { d.hidden = true; document.body.classList.remove("open"); return; }
    d.hidden = false; document.body.classList.add("open");
    let h = `<button class="x" data-act="close" aria-label="Close">✕</button>`;
    if (st.sel) {
      const n = N[st.sel];
      const out = EDGES.filter(e => e[0] === n.id), inn = EDGES.filter(e => e[1] === n.id);
      if (P) h += `<button class="back" data-act="back">Back to path ${esc(P.id)}</button>`;
      h += `<p class="kicker"><span class="kd k-${n.k}"></span>${KIND[n.k]}${n.rel !== "L" ? `, ${REL[n.rel]}` : ""}</p>`;
      h += `<h2>${esc(n.t)}</h2><p class="desc">${esc(n.d)}</p>`;
      h += `<h3>What can go wrong</h3>` + errItems(n.e);
      h += `<h3>Next</h3><ul class="nav">${out.map(e => `<li><button data-node="${e[1]}">${esc(N[e[1]].t)}${e[2] ? `<span>${esc(e[2])}</span>` : ""}</button></li>`).join("") || `<li class="muted">End of the journey</li>`}</ul>`;
      h += `<details><summary>More about this step</summary>
        <p class="lbl">Comes from</p><ul class="nav">${inn.map(e => `<li><button data-node="${e[0]}">${esc(N[e[0]].t)}</button></li>`).join("") || `<li class="muted">Journey starts here</li>`}</ul>
        ${n.sys.length ? `<p class="lbl">Systems involved</p><p class="muted">${n.sys.map(esc).join(", ")}</p>` : ""}
        <p class="lbl">Error buckets</p><p class="muted">${[...new Set(n.e.flatMap(x => x[3].split(",")))].map(k => BUCKET[k] || k).join(", ")}</p>
        <p class="lbl">On paths</p><p class="muted">${PATHS.filter(p => p.nodes.has(n.id)).map(p => p.id).join(", ")}</p></details>`;
    } else {
      const ids = [...P.nodes], e = ids.reduce((a, id) => a + N[id].e.length, 0), c = ids.reduce((a, id) => a + crit(N[id]), 0);
      h += `<p class="kicker">${esc(PATH_GROUPS[P.g])}</p><h2>${esc(P.t)}</h2><p class="desc">${esc(P.n)}</p>
        <p class="stats"><span><b>${P.seq.length}</b> steps</span><span><b>${e}</b> errors</span><span><b>${c}</b> critical</span></p>
        <h3>Steps in order</h3><ol class="steps">${P.seq.map((id, i) => `<li><button data-node="${id}"><span class="i">${i + 1}</span><span>${esc(N[id].t)}</span><span class="n">${N[id].e.length}</span></button></li>`).join("")}</ol>`;
      if (P.sideIds.length) h += `<p class="lbl">Also triggered</p><ul class="nav">${P.sideIds.map(id => `<li><button data-node="${id}">${esc(N[id].t)}</button></li>`).join("")}</ul>`;
    }
    d.innerHTML = h; d.scrollTop = 0;
  }

  // ---------- errors tab ----------
  function renderErrors() {
    const P = curPath(), q = st.q.trim().toLowerCase();
    let rows = "", total = 0;
    BANDS.forEach(b => {
      let body = "";
      stepsOf(b.id).filter(n => !P || P.nodes.has(n.id)).forEach(n => {
        n.e.filter(x => st.sev[x[2]]).sort((a, c) => SO[a[2]] - SO[c[2]]).forEach(x => {
          if (q && !(n.t + " " + x[0] + " " + x[1]).toLowerCase().includes(q)) return;
          total++;
          body += `<tr data-node="${n.id}" tabindex="0"><td class="tstep">${esc(n.t)}</td><td><p class="et">${esc(x[0])}</p><p class="ei">${esc(x[1])}</p></td><td><span class="pill sev-${x[2]}">${SEV[x[2]]}</span></td></tr>`;
        });
      });
      if (body) rows += `<tr class="grp"><th colspan="3"><span class="sid">${b.id}</span>${esc(b.t)}</th></tr>` + body;
    });
    const cnt = k => NODES.filter(n => !P || P.nodes.has(n.id)).reduce((a, n) => a + n.e.filter(x => x[2] === k).length, 0);
    $("#errors").innerHTML = `<div class="ebar">
      <input type="search" id="q" placeholder="Search errors" aria-label="Search errors" value="${esc(st.q)}">
      <div class="chips">${["C", "H", "M", "L"].map(k => `<button class="chip sev-${k}" data-sev="${k}" aria-pressed="${!!st.sev[k]}">${SEV[k]} <span>${cnt(k)}</span></button>`).join("")}</div>
      <p class="muted">${pl(total, "error")}${P ? ` on ${esc(P.t)}` : ""}</p></div>
      <div class="twrap"><table><thead><tr><th>Step</th><th>What goes wrong</th><th>Severity</th></tr></thead><tbody>${rows || `<tr><td colspan="3" class="muted">Nothing matches. Clear the search or turn a severity back on.</td></tr>`}</tbody></table></div>`;
    $("#q").addEventListener("input", ev => { st.q = ev.target.value; const p = ev.target.selectionStart; renderErrors(); const i = $("#q"); i.focus(); i.setSelectionRange(p, p); });
  }

  function renderBar() {
    document.querySelectorAll("[data-ch]").forEach(b => b.setAttribute("aria-selected", b.dataset.ch === st.ch));
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === st.tab));
    $("#journey").hidden = st.tab !== "journey"; $("#errors").hidden = st.tab !== "errors";
    $("#path").value = st.path || ""; $("#clear").hidden = !st.path;
  }
  function render() { renderBar(); renderDrawer(); if (st.tab === "journey") renderJourney(); else renderErrors(); }

  // channel switch: load that channel's data, path list and summary
  function loadChannel(ch) {
    const C = CHANNELS[ch];
    st.ch = ch; st.path = null; st.sel = null; st.q = "";
    ({ BANDS, NODES, EDGES, PATH_GROUPS, PATHS } = C.data);
    ORDER = C.data.ORDER || ONLINE_ORDER;
    N = {}; NODES.forEach(n => { N[n.id] = n; });
    B = {}; BANDS.forEach(b => { B[b.id] = b; });
    $("#ttl").textContent = C.title;
    $("#path").innerHTML = `<option value="">All steps, no path</option>` + PATH_GROUPS.map((g, gi) =>
      `<optgroup label="${esc(g)}">${PATHS.filter(p => p.g === gi).map(p => `<option value="${p.id}">${esc(p.t)}</option>`).join("")}</optgroup>`).join("");
    const total = NODES.reduce((a, n) => a + n.e.length, 0), tc = NODES.reduce((a, n) => a + crit(n), 0);
    $("#sum").textContent = `${NODES.length} steps in ${BANDS.length} stages, ${PATHS.length} customer paths, ${total} possible errors (${tc} critical).`;
    try { localStorage.setItem("aio-paths-ch", ch); } catch (e) {}
  }
  $("#path").addEventListener("change", ev => { st.path = ev.target.value || null; st.sel = null; render(); });
  let startCh = "online";
  try { const s = localStorage.getItem("aio-paths-ch"); if (CHANNELS[s]) startCh = s; } catch (e) {}
  loadChannel(startCh);

  document.addEventListener("click", ev => {
    const t = ev.target.closest("[data-node],[data-act],[data-tab],[data-sev],[data-ch]");
    if (!t) return;
    if (t.dataset.ch) { if (t.dataset.ch !== st.ch) { loadChannel(t.dataset.ch); render(); document.querySelector(".scroll").scrollTop = 0; } }
    else if (t.dataset.node) {
      st.sel = t.dataset.node;
      if (st.tab !== "journey") { st.tab = "journey"; render(); } else { renderDrawer(); renderJourney(); }
      const el = document.querySelector(`.card[data-node="${st.sel}"]`);
      if (el && !ev.target.closest(".card")) el.scrollIntoView({ block: "center", behavior: "smooth" });
    } else if (t.dataset.act === "close") { st.sel = null; st.path = null; render(); }
    else if (t.dataset.act === "back") { st.sel = null; render(); }
    else if (t.dataset.act === "clear") { st.path = null; st.sel = null; render(); }
    else if (t.dataset.tab) { st.tab = t.dataset.tab; render(); }
    else if (t.dataset.sev) { st.sev[t.dataset.sev] = st.sev[t.dataset.sev] ? 0 : 1; renderErrors(); }
  });
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape") { if (st.sel) st.sel = null; else st.path = null; render(); }
    const r = ev.target.closest && ev.target.closest("tr[data-node]");
    if (r && ev.key === "Enter") r.click();
  });
  render();
})();

</script>
