l hours not shown on the website","Guests misled on holidays","M","CN",[]],["Split shifts or overnight hours displayed in the wrong order or time format","Confusing hours","M","CX",[]],["Wrong pin for an address that geocodes badly","Guests sent to the wrong place","H","CX",[]]]},{"id":"C12","b":"C","k":"op","rel":"L","t":"Gift card, catering, loyalty, deals sections","d":"Sections that pull from other AIO modules: gift card categories, catering packages, loyalty tiers and sign-up, deals, spotlights and reviews. Their data is fetched when the site is built.","sys":["Website builder","Marketing Gift cards","Marketing Loyalty","Marketing Deals"],"e":[["Deal or spotlight expires or is deleted, the website keeps showing it until republished","Guest expects an offer that is gone","H","CN,M",[]],["Gift card section added while digital gift cards are not set up for online, the buy link leads nowhere","Lost gift card sales","H","CN,OB",[]],["Loyalty tiers changed in Marketing after publish, website shows old tiers and points","Guest disputes rewards","M","CN",[]],["Fetch of module data fails during the build, the section silently renders empty","Empty section on the live site","M","T",[]]]},{"id":"C13","b":"C","k":"op","rel":"L","t":"Header and footer","d":"Header with logo, navigation items and dropdowns, call to action button, sticky and mobile menu; footer with colour style, hours, address and social links taken from the Brand Book.","sys":["Website builder","Brand Book"],"e":[["Footer colour style differs between builder and live site","Brand looks inconsistent","M","CX",[]],["Social link icons shown with empty links after a Brand Book sync","Dead icons","L","CX,CN",[]],["Logo too large or wrong variant in the mobile header","Header covers content on phones","L","CX",[]]]},{"id":"C14","b":"C","k":"op","rel":"L","t":"Popups, consent and announcements","d":"Global popups (announcement, form popup, sign-up popup that creates a guest, cookie consent) with triggers and styling; the Announcements page manages announcement content shown on the site.","sys":["Website builder","Web Dash: Website","Guestbook / CRM"],"e":[["Cookie consent off or misconfigured while analytics and pixels run","Privacy exposure (CCPA)","C","L",[]],["Popup shows on every page view because dismissal is not remembered","Guests annoyed","M","CX",[]],["Sign-up popup adds guests without clear marketing terms","Messaging without consent","C","L",[]],["Announcement end date passes but it stays live until republish","Outdated message shown","M","CN",[]]]},{"id":"C15","b":"C","k":"op","rel":"L","t":"Desktop and mobile views","d":"The operator switches between desktop, tablet and mobile views and sets per-device overrides for sizes, spacing and visibility.","sys":["Website builder"],"e":[["Mobile view in the builder does not match a real phone (fonts, dropdowns, sticky header)","Broken mobile site goes live","H","CX,T",[]],["Per-device override hides a section on mobile that holds the only Order Online button","Lost mobile orders","H","CX",[]],["Tablet view rarely checked, layout breaks in between breakpoints","Untidy site on tablets","L","CX",[]]]},{"id":"D1","b":"D","k":"dec","rel":"L","t":"Brand Book changed since last sync?","d":"When the builder opens it compares the Brand Book updated date with the copy stored in the draft. If newer, it shows a New changes made in brand book modal (Later or Sync now), then a reminder banner if postponed.","sys":["Website builder","Brand Book"],"e":[["Change detection only runs when the builder is open, so a live site never learns of Brand Book changes on its own","Site drifts from the brand","M","CN",[]],["Modal shows again on every load if the stored date is not saved after Later","Operator nagged","L","CX",[]]]},{"id":"D2","b":"D","k":"op","rel":"L","t":"Sync now from Brand Book","d":"Sync now copies Brand Book fonts (only properties that changed since the last sync), social links, logos and colours into the draft. Colours land in the palette but do not rewrite colour styles. The live site changes only after a republish.","sys":["Website builder","Brand Book"],"e":[["Sync overwrites manual font changes the operator made in the builder for the same property","Custom styling lost","M","D,CX",[]],["Operator expects the live site to change after Sync now but nothing happens until republish","Confusion, support tickets","M","CX",[]],["Sync fails silently when the Brand Book request fails, the success snackbar still shows","False confirmation","M","T,CX",[]]]},{"id":"D3","b":"D","k":"op","rel":"L","t":"Preview the site","d":"Preview renders the draft with the same shared section components as the live site, inside Web Dash, per device.","sys":["Website builder"],"e":[["Preview uses the latest shared components while the live site was built on an older release, so they differ","Operator sees one thing, guests another","M","T,CN",[]],["Fonts and maps work in preview but fail on the published site","Surprise after publishing","H","CN",[]],["Data driven sections in preview show current data, the live site shows the snapshot from the last build","Mismatch between preview and live","M","CN",[]]]},{"id":"D4","b":"D","k":"op","rel":"L","t":"Run ADA accessibility scan","d":"The builder runs an automated accessibility scan (axe-core) on each page and device, lists violations and stores the latest scan on the website; the Overview shows an ADA compliance card from it.","sys":["Website builder","Web Dash: Website"],"e":[["ADA compliance report wrong or not loading on production","Operator cannot rely on the report","H","L,R",["4716"]],["Latest scan cached for a day, fixes made today still show the old result","Operator thinks fixes failed","M","T,R",[]],["Scan runs on the builder canvas, not on the published site, so live only issues are missed","False sense of compliance","H","L",[]],["Automated scan presented as compliance although it covers only part of the guidelines","ADA lawsuit exposure","C","L",[]]]},{"id":"E1","b":"E","k":"dec","rel":"L","t":"Temporary or custom domain?","d":"From the publish modal the operator publishes to the temporary domain (shared staging, up to 3 versions per restaurant) or to the live custom domain, which needs a verified domain and certificate.","sys":["Website builder"],"e":[["Operator publishes a draft to live by mistake when meaning to test on the temporary domain","Unfinished site goes live","H","CX",[]],["Publish clicked while the last auto-save is still pending, the build uses older content","Latest edits missing live","H","D,T",[]],["No check for missing essentials (Order Online link, hours, privacy policy) before publishing","Incomplete site goes live","M","CX",[]]]},{"id":"E2","b":"E","k":"soft","rel":"L","t":"Assign temporary subfolder","d":"For the temporary domain the draft gets a subfolder named from the restaurant alias and a counter 1 to 3 on a shared bucket. A fourth version is refused: Maximum of 3 staging versions allowed.","sys":["S3 / CDN"],"e":[["Limit of 3 temporary versions reached, the operator must unpublish one first and the message does not say which","Blocked publishing","M","CX",[]],["Two drafts published at once get the same free counter","One temporary site overwrites another","M","T,D",[]],["Alias changed after publishing, old subfolder left behind","Old temporary URLs still public","L","D",[]]]},{"id":"E3","b":"E","k":"op","rel":"L","t":"Connect custom domain","d":"The operator enters the domain, AIO creates a hosted zone and requests an SSL certificate, and shows the nameservers or DNS records to set at the registrar. Existing records (www, subdomains, mail) are read so they can be carried over.","sys":["Website builder","S3 / CDN"],"e":[["Moving nameservers drops the restaurant's existing mail or other records that were not copied over","Restaurant email stops working","C","OB,D",[]],["Domain typed with www or a typo, the hosted zone and certificate are created for the wrong name","Domain never verifies","M","OB,CX",[]],["Operator lacks registrar access, onboarding stalls with no hand-off to AIO Ops","Go-live delayed","M","OB",[]]]},{"id":"E4","b":"E","k":"dec","rel":"L","t":"Domain and SSL verified?","d":"Publishing live is refused until nameservers resolve and the certificate is issued. The status is checked against the certificate each time domain settings load.","sys":["Website builder","S3 / CDN"],"e":[["DNS propagation takes hours, the operator retries and sees the same error with no time estimate","Frustration, support tickets","M","CX,OB",[]],["Certificate request expires after validation is not completed in time, a new request is needed","Go-live blocked","H","OB,T",[]],["Verified status read from a slow call on every load, the builder hangs while waiting","Slow builder","L","T",[]]]},{"id":"E5","b":"E","k":"soft","rel":"L","t":"Provision bucket and CloudFront","d":"For a live publish AIO creates or reuses the restaurant's bucket and CloudFront distribution with the custom domain and certificate attached.","sys":["S3 / CDN"],"e":[["Distribution created without the alternate domain or certificate, site serves a certificate error","Site unreachable","C","OB,T",[]],["Partial failure leaves a bucket without a distribution, publish refused for missing CloudFront distribution","Cannot publish","H","T",[]]]},{"id":"E6","b":"E","k":"int","rel":"L","t":"Build workflow runs","d":"AIO triggers a GitHub workflow that fetches the website data, builds the static site (pulling menu, deals, spotlights, gift cards and tiers at build time), uploads it to the bucket or temporary subfolder and invalidates the CDN cache.","sys":["Website builder","S3 / CDN","Menu Manager"],"e":[["The published site uses a different font from the builder","Brand look broken live","H","CN,T",["4681","4702"]],["A restaurant website fails to publish","Site cannot be updated","C","T",["4688"]],["Workflow trigger succeeds but the run cannot be found, status stays unknown","Operator republishes repeatedly","M","T",[]],["Build uses the platform release current at publish time, not the one the operator previewed","Unexpected layout changes","M","T,CN",[]],["CDN invalidation misses some paths, guests see a mix of old and new pages","Inconsistent site","M","T",[]]]},{"id":"E7","b":"E","k":"dec","rel":"L","t":"Did the publish succeed?","d":"The builder polls the workflow status and shows in progress, success, failure or cancelled with the publish date and a link to the site. Publishing an eligible verified custom domain can also start restaurant email sender setup. Email verification proceeds separately from the website build.","sys":["Website builder"],"e":[["Shows published but the temporary link does not work","Operator shares a dead link","H","T,CX",["4658"]],["Preview link for the temporary domain not working after publishing","Cannot review before going live","H","T,CX",["4922"]],["Status stuck in progress when polling stops or the run is lost","Operator cannot tell if the site is live","M","T",[]]]},{"id":"E8","b":"E","k":"int","rel":"L","t":"Search Console and sitemap","d":"After a live publish the workflow asks AIO to verify the domain in Google Search Console (DNS TXT record) and submit the sitemap, if Google is connected and the certificate is valid.","sys":["Website builder","Google Business Profile"],"e":[["The published sitemap contains temporary domain URLs","Wrong URLs indexed by Google","H","CN,D",["4793"]],["Verification fails because the TXT record has not propagated within the short wait","Sitemap not submitted","M","T",[]],["Google not connected, sitemap submission skipped with no message to the operator","Slower indexing","L","CX",[]]]},{"id":"E9","b":"E","k":"op","rel":"L","t":"Retry, cancel or unpublish","d":"After a failure the operator can retry the publish or cancel a running workflow; a temporary version can be unpublished, which deletes its subfolder and clears the CDN cache. Unpublishing a custom domain disables its branded campaign email sender.","sys":["Website builder","S3 / CDN"],"e":[["Publish fails and Unpublish does not work, so the site cannot be republished on the temporary domain","Operator stuck","H","T",["4750"]],["Cancel marks the run cancelled while files were already partly uploaded","Half updated site","M","T,D",[]],["Repeated retries start several builds that finish out of order","Older version ends up live","M","T",[]]]},{"id":"F1","b":"F","k":"cust","rel":"L","t":"Guest opens the website","d":"The guest opens the custom domain or temporary URL. Published pages serve the built design and assets. Some sections, including the campaign announcement popup, request current restaurant content when displayed.","sys":["S3 / CDN"],"e":[["Fonts fall back to a default serif on the live site","Site looks unprofessional","H","CX,CN",["4681"]],["Temporary site is indexable and competes with the real site in search","SEO harm","M","CX",[]],["Certificate expired or not renewed, browser shows a security warning","Guests leave","C","T",[]],["Slow first load on mobile from large media","Guests bounce","M","T",[]]]},{"id":"F2","b":"F","k":"cust","rel":"L","t":"Sees popups and consent banner","d":"Announcement, sign-up and cookie consent popups show according to their triggers; analytics and pixels load only after targeting consent.","sys":["S3 / CDN"],"e":[["Tags fire before consent is given","Privacy exposure","C","L",[]],["Popup covers the Order Online button on mobile with no visible close","Lost orders, ADA exposure","H","CX,L",[]]]},{"id":"F3","b":"F","k":"cust","rel":"L","t":"Navigates between pages","d":"Header navigation highlights the current page; buttons link to other pages, sections or external sites.","sys":["S3 / CDN"],"e":[["Active page not highlighted correctly in the navigation on every website","Guests lose their place","M","CX",["4817"]],["A published button navigates to the wrong destination","Broken navigation","H","CX,T",["4701"]],["Dropdown navigation does not open on touch t submit","H","CX",["4723"]],["No captcha or rate limit, spam submissions flood the inbox and the Guestbook","Spam leads and fake guests","H","S,D",[]],["File upload too large or wrong type fails with no message","Guest gives up","M","CX",[]],["Submit error not shown, guest believes it was sent","Lost lead","H","CX",[]]]},{"id":"G1","b":"G","k":"soft","rel":"L","t":"Submission stored, emails sent","d":"AIO stores the submission, uploads files to S3, emails a confirmation to the guest and a notification to the form recipients through the email queue, and for sign-up popups creates the guest in the Guestbook with a segment.","sys":["Email service","Guestbook / CRM","S3 / CDN"],"e":[["Notification email to recipients fails and the error is only logged","Restaurant misses the lead","H","T",[]],["Guest created from a popup without consent fields stored","Marketing compliance gap","C","L,D",[]],["Duplicate guest created when the same person signs up with a different email","Duplicate records in Guestbook","M","D",[]],["Uploaded files are publicly readable","Privacy exposure","H","S",[]]]},{"id":"G2","b":"G","k":"op","rel":"L","t":"Reviews submissions on Forms page","d":"The Forms page lists forms and their submissions for the location.","sys":["Web Dash: Website"],"e":[["Submissions from a deleted or duplicated form missing or grouped wrongly","Leads overlooked","M","D,R",[]],["No export or status to track follow up","Leads handled in spreadsheets","L","R,CX",[]]]},{"id":"H1","b":"H","k":"op","rel":"L","t":"Edit and republish","d":"Any change, including data that comes from other modules, reaches guests only after a republish.","sys":["Website builder"],"e":[["Operator edits the draft and forgets to republish","Live site stays stale","M","CX",[]],["Republish of a different draft replaces the live site","Wrong version live","H","CX,D",[]]]},{"id":"H2","b":"H","k":"soft","rel":"L","t":"Platform release reaches sites","d":"A release changes shared section components, default n","n":"Domain connected and verified, live publish, Search Console and sitemap.","s":"A1 A2 B1 C1 C2 C3 C15 D1 D3 E1 E3 E4 E5 E6 E7 E8 F1","side":""},{"id":"P04","g":1,"t":"DNS not ready, then verified","n":"Recovery: verification fails until nameservers and the certificate are in place.","s":"E1 E3 E4 E3 E4 E5 E6 E7 E8 F1","side":""},{"id":"P05","g":1,"t":"Publish fails, then retry","n":"Recovery: the build fails or is cancelled and the operator retries.","s":"E1 E2 E6 E7 E9 E6 E7 F1","side":""},{"id":"P06","g":1,"t":"Unpublish a temporary version","n":"Exit: free a temporary slot or take a broken temporary site down.","s":"E6 E7 E9 H4 H6","side":""},{"id":"P07","g":2,"t":"Guest browses the menu and orders","n":"Guest goes from the website into online ordering or gift cards.","s":"F1 F2 F3 F4 F5 F6 F7","side":"G1"},{"id":"P08","g":2,"t":"Guest submits a form","n":"Contact, catering or sign-up form through to the operator's Forms page.","s":"F1 F2 F3 F7 G1 G2","side":""},{"id":"P09","g":2,"t":"Guest looks for location and hours","n":"Map and hours, then a contact form.","s":"F1 F2 F3 F6 F7 G1","side":""},{"id":"P10","g":3,"t":"Edit and republish","n":"Operator changes the draft and republishes to the temporary domain.","s":"I3 H1 C1 C2 C3 C15 D1 D3 E1 E2 E6 E7 F1","side":""},{"id":"P11","g":3,"t":"Platform release changes a live site","n":"A release changes settings or components, picked up on the next republish.","s":"E6 E7 H2 H1 E1 E3 E4 E5 E6 E7 E8 F1","side":""},{"id":"P12","g":3,"t":"Hours or menu change after publishing","n":"Restaurant data changes elsewhere; the site is stale until republished.","s":"E7 H3 H1 E1 E2 E6 E7 F1","side":""},{"id":"P13","g":3,"t":"Offboard the website and domain","n":"Exit: remove the custom domain and take the site down.","s":"I3 H1 H5 H6","side":""},{"id":"P14","g":4,"t":"Review stats, SEO and tags","n":"Overview, SEO page, analytics tags, then edit.","s":"G1 G2 I1 I2 I3 H1","side":""}],"NOTES":["The site build captures design and content used at publish time. The announcement popup separately fetches active campaign data and checks its schedule. Verify the affected section before attributing stale content to the last publish.","Website sub-pages confirmed from the sidebar: Overview, Design, Announcements, SEO, Forms. A separate Leads page was not found in the sidebar although a leads endpoint exists in the backend.","No AI generated site or copy was found in the live builder code.","Whether permission checks for publish and domain actions are enforced on the server as well as the sidebar was not confirmed (TBC with engineering).","The URL check behind PROD-4841 and PROD-4923 was a regex refusing uppercase, query strings and long domain endings; the link modal now uses another check, but other editors may still use the old one.","Build-dependent changes take effect on a rebuild. The release and rebuild history of a particular restaurant requires operational confirmation.","Form spam protection (captcha or rate limit) was not found on the public submit endpoint; duplicate rejection exists only for guest-creating popups.","Brand Book tickets PROD-4836 and PROD-4781 are attached in the Brand Book map, not here.","Zeus internal, 02473c3bac9. See web-builder/website/website.service.ts, quantumhorizon and web-components/src/sections/AnnouncementPopup."]},"brandbook":{"name":"Brand Book","title":"Brand Book: operator paths, consumers and what can go wrong","BANDS":[{"id":"A","t":"Access and first view","s":"Opening the Brand Book for a location and what is there on first visit"},{"id":"B","t":"Build the brand","s":"Logos, colours, fonts with their Done mark, content images, brand voice and social links"},{"id":"C","t":"Save","s":"The Save button, what is sent and what the server stores"},{"id":"D","t":"Consumers pick it up","s":"Website builder sync, new website drafts, emails, menu boards and media pickers"},{"id":"E","t":"Later changes","s":"Editing or deleting brand items after other products already use them"}],"NODES":[{"id":"A1","b":"A","k":"term","rel":"L","t":"Operator opens Brand Book","d":"The operator opens Marketing, Brand Book in Web Dash. Access is behind the Brand Book feature permission. The Brand Book belongs to the selected restaurant (location).","sys":["Web Dash: Brand Book"],"e":[["Multi-location brand must set up the same Brand Book once per location, with no copy between locations","Duplicate work and drift between stores","M","OB,D",[]],["Permission missing, the page is simply absent from the sidebar","Operator cannot find it","L","OB,CX",[]]]},{"id":"A2","b":"A","k":"op","rel":"L","t":"First view and defaults","d":"On first visit the page shows default items: Heading, Sub-heading and Paragraph fonts, default colours and a list of brand voice options. No AI generated Brand Book from the restaurant details or an existing website was found in the live code.","sys":["Web Dash: Brand Book"],"e":[["Defaults look like a finished brand, operator never customises them and every consumer uses generic styles","Unbranded website and emails","M","OB,CX",[]],["Page loads with a spinner and no data when the content request fails, with no error message","Operator cannot work","M","T,CX",[]],["Restaurant logo already uploaded elsewhere (online ordering, receipts) is not offered here","Logo uploaded twice, versions drift","L","CN",[]]]},{"id":"B1","b":"B","k":"op","rel":"L","t":"Upload logos","d":"The operator uploads one or more logos through a signed upload to file storage; each is saved as a logo item linked to the stored file.","sys":["Web Dash: Brand Book","S3 / CDN"],"e":[["Logo variants (light, dark, icon) are not labelled, consumers pick the first one even when it does not suit a dark background","Invisible logo on dark headers or boards","M","CN,CX",[]],["Very large or transparent-less logo files accepted without guidance","Blurry or boxed logos downstream","L","CX",[]],["Upload succeeds but the save never happens, the file sits in storage unlinked","Logo missing in consumers","M","D",[]]]},{"id":"B2","b":"B","k":"op","rel":"L","t":"Set brand colours","d":"The operator adds, names and edits colours stored as hex values.","sys":["Web Dash: Brand Book"],"e":[["No contrast check between brand colours, text and background combinations built from them are unreadable","Accessibility exposure on the website","H","L,CX",[]],["Colour names are free text with no role (primary, accent, background), consumers cannot tell which colour to use where","Inconsistent brand use","M","CN",[]],["Invalid or short hex value accepted","Wrong colour downstream","L","D",[]]]},{"id":"B3","b":"B","k":"op","rel":"L","t":"Set fonts and mark Done","d":"Heading, Sub-heading and Paragraph fonts each have family, style, size, weight, line height and letter spacing, from the font list or an uploaded custom font. Each font item is edited open and must be marked Done; Save skips any font still open and is disabled while a default font is open.","sys":["Web Dash: Brand Book"],"e":[["Sub-heading and Paragraph fonts not marked Done are never saved, so they are missing for every consumer","Website sync crashes or does nothing","H","D,CN,CX",["4836"]],["Done mark is easy to miss and there is no unsaved state per font","Operator thinks fonts are saved","M","CX",[]],["Empty font family silently saved as Poppins","Brand font replaced without notice","M","D,CX",[]],["Custom uploaded font not available on the published website","Fonts fall back on the live site","H","CN",[]]]},{"id":"B4","b":"B","k":"op","rel":"L","t":"Add content images","d":"The operator adds brand photos to the content library (compressed on upload), used later as media in other products.","sys":["Web Dash: Brand Book","S3 / CDN"],"e":[["Image deleted here while used by a website, email or board","Broken images downstream","M","D,CN",[]],["No rights or source recorded for uploaded photos","Copyright exposure","M","L",[]]]},{"id":"B5","b":"B","k":"op","rel":"L","t":"Pick brand voice","d":"The operator selects brand voice options (tone words) and can add custom ones. The campaign SMS writing assistant includes the active voice selections in its generation request.","sys":["Web Dash: Brand Book"],"e":[["An outdated voice is still selected when a campaign is rewritten","The generated text sounds wrong for the restaurant","M","CX",[]],["Removing a custom voice and saving deletes it with no undo","Lost setting","L","D",[]]]},{"id":"B6","b":"B","k":"op","rel":"L","t":"Add social links","d":"Links for social networks (Facebook, Instagram, X, TikTok and so on) that feed the website footer icons.","sys":["Web Dash: Brand Book"],"e":[["Link saved without https or as a handle, website icon goes nowhere","Dead social icons","L","CX",[]],["Network name not mapped to a website icon, the link is ignored on sync","Missing social icon","L","CN",[]]]},{"id":"C1","b":"C","k":"op","rel":"L","t":"Save the Brand Book","d":"One Save button sends every colour, voice, closed font, social link and logo plus a list of deleted items. There is a leave page warning for unsaved changes.","sys":["Web Dash: Brand Book"],"e":[["Save fails and only logs to the console, the button returns to Save with no error","Operator believes it saved","H","T,CX",[]],["Two managers save at once, the later save overwrites the other's changes","Lost edits","M","D",[]],["Fonts left open are silently left out of the save","Missing fonts downstream","H","D",[]]]},{"id":"C2","b":"C","k":"soft","rel":"L","t":"Store brand items","d":"The server creates new items, updates changed ones by id and deletes the ids listed as removed, and the Brand Book updated date moves on so the website builder can spot the change.","sys":["Brand Book"],"e":[["An edit or deletion affects an item owned by another restaurant","Another location loses brand assets","H","S,D",[]],["Creates, updates and deletes are not in one transaction, a failure leaves a half saved brand","Inconsistent brand data","M","D,T",[]],["Updated date not moved when only a delete happens, the website never offers a sync","Website keeps the old brand","M","CN",[]]]},{"id":"C3","b":"C","k":"dec","rel":"L","t":"Saved successfully?","d":"On success the page reloads the saved items and refreshes the cached Brand Book for other screens.","sys":["Web Dash: Brand Book"],"e":[["Other open screens keep a cached Brand Book until reloaded","Consumers show old colours or logos","L","T",[]],["No success confirmation shown","Operator saves repeatedly","L","CX",[]]]},{"id":"D1","b":"D","k":"dec","rel":"L","t":"Website builder spots a change?","d":"When the website builder opens, it compares the Brand Book updated date with the copy stored in the draft and, if newer, shows New changes made in brand book with Later or Sync now.","sys":["Website builder","Brand Book"],"e":[["Change only noticed when someone opens the builder, the live website keeps the old brand indefinitely","Brand drift on the website","M","CN",[]],["Each draft tracks its own copy, syncing one draft leaves the others out of date","Inconsistent drafts","L","CN",[]]]},{"id":"D2","b":"D","k":"op","rel":"L","t":"Sync now in the builder","d":"Sync now copies fonts (only properties that changed), logos, colours and social links into the draft and shows a success message. Colours go to the palette but do not rewrite section colour styles. The live site changes only after republishing.","sys":["Website builder","Brand Book"],"e":[["Sync now crashes or fails to bring the saved Brand Book changes into the site","Operator cannot apply the brand","H","CN,T",["4836","4781"]],["Sync overwrites font changes made by hand in the builder for the same property","Custom styling lost","M","D,CX",[]],["Changed colours do not update colour styles in use, so the site does not look different after sync","Operator thinks sync failed","M","CN,CX",[]],["Success shown even when the Brand Book request failed","False confirmation","M","T,CX",[]]]},{"id":"D3","b":"D","k":"soft","rel":"L","t":"New website draft takes the brand","d":"When a new website draft is created, the builder applies all Brand Book fonts to the global text and button styles, sets social links and stores a copy of the Brand Book.","sys":["Website builder","Brand Book"],"e":[["Missing fonts leave template defaults in place without a warning","Site does not match the brand","M","CN",[]],["Empty Brand Book gives a generic site","Unbranded site","L","OB,CX",[]]]},{"id":"D4","b":"D","k":"int","rel":"L","t":"Use brand assets in campaign content","d":"The campaign and journey email builders offer Brand Book colours in the colour palette and Brand Book images and logos in media pickers. Values are copied into each email when chosen. The SMS rewrite request also includes active brand voices.","sys":["Marketing Campaigns","Marketing Journeys","Brand Book"],"e":[["Brand colour changed later, emails already built keep the old colour","Inconsistent emails","L","CN",[]],["Logo deleted from the Brand Book, scheduled emails show a broken image","Unprofessional email sent to guests","M","CN,D",[]]]},{"id":"D5","b":"D","k":"int","rel":"L","t":"Menu boards use the brand","d":"The menu board canvas offers Brand Book colours, fonts and logos and keeps a reference to the Brand Book colour on elements that use it.","sys":["Brand Book"],"e":[["Brand colour deleted while a board element still references it","Board falls back to a default colour","M","CN",[]],["Brand font not available on the TV app","Font falls back on the board","M","CN",[]]]},{"id":"D6","b":"D","k":"int","rel":"L","t":"Media pickers use brand images","d":"Deals, spotlights, gift cards and other forms offer Brand Book content images in their image pickers.","sys":["Marketing Deals","Marketing Gift cards","Brand Book"],"e":[["Image removed from the Brand Book disappears from live deals or gift card designs","Broken images for guests","M","CN,D",[]],["Large uncompressed images chosen for small slots","Slow pages and apps","L","T",[]]]},{"id":"E1","b":"E","k":"op","rel":"L","t":"Edit the Brand Book later","d":"The operator changes fonts, colours, logos or links after other products already use them, then saves again.","sys":["Web Dash: Brand Book"],"e":[["Operator expects every product to update automatically, but website, emails and boards only change when each is re-synced, edited or republished","Brand inconsistent across channels","M","CN,CX",[]],["Re-opening a font to edit it removes it from the next save until marked Done again","Font lost","H","D",[]]]},{"id":"E2","b":"E","k":"op","rel":"L","t":"Delete brand items","d":"Colours, voices, social links and logos removed on the page are deleted on the next save.","sys":["Web Dash: Brand Book"],"e":[["No check whether the item is used by a website, email or board before deleting","Broken references downstream","M","CN,D",[]],["Deleting all fonts or colours leaves consumers with nothing to read","Fallback styles everywhere","L","CN",[]]]},{"id":"E3","b":"E","k":"term","rel":"L","t":"Brand applied","d":"The brand is stored and the consumers that were synced or edited show it.","sys":[],"e":[["No single view of which products are using an out of date Brand Book","Drift goes unnoticed","L","R,CN",[]]]}],"EDGES":[["A1","A2",""],["A2","B1","Set up"],["A2","B3","Change fonts only"],["A2","E1","Edit existing"],["B1","B2",""],["B2","B3",""],["B3","B4",""],["B4","B5",""],["B5","B6",""],["B6","C1",""],["C1","C2",""],["C2","C3",""],["C3","C1","No, retry"],["C3","D1","Yes, website exists"],["C3","D3","Yes, new website draft"],["C3","D4","Yes, emails"],["C3","D5","Yes, menu boards"],["C3","D6","Yes, media pickers"],["D1","D2","Yes, Sync now"],["D1","E3","No change or Later"],["D2","E3",""],["D3","E3",""],["D4","E3",""],["D5","E3",""],["D6","E3",""],["E1","E2","Remove items"],["E1","C1","Save changes"],["E2","C1",""]],"PATH_GROUPS":["Set up","Consumers","Recovery and later changes"],"PATHS":[{"id":"P01","g":0,"t":"First set-up for a new website","n":"Baseline: every section filled, saved, then a new website draft takes the brand.","s":"A1 A2 B1 B2 B3 B4 B5 B6 C1 C2 C3 D3 E3","side":""},{"id":"P02","g":1,"t":"Edit and Sync now on the website","n":"Brand changed later, the builder offers Sync now.","s":"A1 A2 E1 C1 C2 C3 D1 D2 E3","side":""},{"id":"P03","g":2,"t":"Fonts not marked Done, sync fails","n":"Fonts left open are skipped on save, so Sync now crashes or does nothing.","s":"A1 A2 B3 B4 B5 B6 C1 C2 C3 D1 D2 E3","side":""},{"id":"P04","g":2,"t":"Save fails, then retry","n":"Recovery: the save request fails silently and the operator saves again.","s":"A1 A2 E1 C1 C2 C3 C1 C2 C3 D1 D2 E3","side":""},{"id":"P05","g":1,"t":"Emails, menu boards and media","n":"Other products read brand colours, fonts and images when they are next edited.","s":"A1 A2 E1 C1 C2 C3 D4 E3","side":"D5 D6"},{"id":"P06","g":2,"t":"Delete items used elsewhere","n":"Exit: items removed while menu boards still reference them.","s":"A1 A2 E1 E2 C1 C2 C3 D5 E3","side":"D6"}],"NOTES":["No AI generation of the Brand Book (from restaurant details or an existing website) was found in the live code; first-time set-up is manual with default items.","The campaign copy request reads active brand voices for SMS suggestions. Check the saved selection when the generated tone is unexpected.","The Save button is now disabled while a default font is still open, a guard added after the Done related tickets; non-default fonts left open are still skipped.","Engineering should confirm that every Brand Book change is limited to assets owned by the selected restaurant.","Menu boards, email builders and media pickers were confirmed to read the Brand Book from file names and imports; exact live versus copy behaviour per consumer was assumed to be copy on choose.","The Brand Book is per restaurant (location); no copy between locations was found.","Zeus internal, 02473c3bac9. See the Web Dash Brand Book, campaign SMS composer and campaign_brand_voices in the AI request."]},"deals":{"name":"Deals","title":"Deals: operator and guest paths and what can go wrong","BANDS":[{"id":"A","t":"Choose the offer","s":"Start a restaurant offer and decide what the guest must do to qualify."},{"id":"B","t":"Define price and scope","s":"Choose the buy items, discounted items and calculation."},{"id":"C","t":"Set availability","s":"Choose dates, service hours, order sources and code restrictions."},{"id":"D","t":"Review and release","s":"Save a draft or activate the completed deal."},{"id":"E","t":"Claim at checkout","s":"Follow the offer through online and device checkout."},{"id":"F","t":"Maintain and reconcile","s":"End or archive an offer and check discounted sales."}],"NODES":[{"id":"A1","b":"A","k":"term","rel":"L","t":"Open the deals list","d":"Open Deals for the intended restaurant and inspect existing offers before creating another.","sys":["Web Dash: Deals"],"e":[["An archived offer with the same promotion is overlooked","Manager duplicates a previous configuration","M","CX",[]]]},{"id":"A2","b":"A","k":"op","rel":"L","t":"Select the deal type","d":"Choose discount, buy this get this, gift with purchase, or gift without purchase in the classic flow.","sys":["Web Dash: Deals"],"e":[["Changing type retains items from the previous type","An unintended product becomes free","C","M,D",[]],["A gift without purchase is configured when a purchase is required","Stock is given away","C","M",[]]]},{"id":"B1","b":"B","k":"op","rel":"L","t":"Define a discount","d":"Set dollars or percentage off and choose the entire order or selected products. Check the effective price on a low value basket.","sys":["Web Dash: Deals"],"e":[["A percentage is interpreted as dollars","Guest is charged the wrong amount","C","M",[]],["A fixed discount exceeds the eligible line value","Order total is understated","C","M",[]]]},{"id":"B2","b":"B","k":"op","rel":"L","t":"Choose qualifying purchases","d":"For a buy and get offer, choose which purchases and quantities count. A gift with purchase also needs its qualifying conditions.","sys":["Web Dash: Deals"],"e":[["Quantity from an excluded item contributes to the threshold","Free item granted incorrectly","C","M,CN",[]],["Two qualifying units on separate lines fail to combine","Guest cannot claim the offer","H","M,CX",[]]]},{"id":"B3","b":"B","k":"op","rel":"L","t":"Choose the reward items","d":"Choose which products receive the saving or gift. A gift without purchase can be configured without a buy group.","sys":["Web Dash: Deals"],"e":[["Buy items are saved as reward items","Wrong item discounted","C","M,D",[]],["The only reward is later removed from the menu","Offer is advertised but cannot be completed","H","CN",[]]]},{"id":"B4","b":"B","k":"op","rel":"L","t":"Select menu scope","d":"The service stores menu, category or individual item selections for buy and get groups. Check partial category selections separately.","sys":["Web Dash: Deals","Menu Manager"],"e":[["Limit on individually selected items prevents choosing only part of a large category","Operator must narrow or broaden the offer","H","CN,CX",["4673"]],["Selecting a full category accidentally includes a newly added premium item","Unintended discounts","C","M,CN",[]]]},{"id":"B5","b":"B","k":"op","rel":"L","t":"Check qualifying spend","d":"When enabled, configure the minimum spend or item quantity and test the basket immediately below, at and above the threshold.","sys":["Web Dash: Deals"],"e":[["A basket one cent below minimum qualifies","Restaurant funds an unearned discount","C","M",[]],["Price changes leave a previously eligible basket below the threshold without an explanation","Guest abandons checkout","H","M,CX",[]]]},{"id":"B6","b":"B","k":"int","rel":"TBC","t":"Check priced modifiers","d":"Check the paid add-ons on a reward item. The Android POS receipt calculates the item deal on the reward line using its base price and quantity. Compare the add-on charges and final amount with the ticket. Verify the online calculation separately.","sys":["Web Dash: Deals","Menu Manager","Online ordering","POS"],"e":[["Discount on a free base item also removes paid extras unexpectedly","Restaurant loses modifier revenue","C","M,CN",[]],["Checkout and receipt assign different prices to the same modified reward","Guest disputes the charge","C","M,CX",[]]]},{"id":"B7","b":"B","k":"op","rel":"L","t":"Set the reward quantity","d":"Buy this get this separates Minimum Item Count from the number of items that receive a discount. Check both with mixed eligible items and repeated quantities.","sys":["Web Dash: Deals","Menu Manager"],"e":[["Two qualifying purchases produce two discounted units where the offer promises one","Restaurant gives an extra reward","C","M",[]],["The last eligible unit is ignored when the qualifying quantity sits on separate order lines","Guest misses an earned discount","H","M,CX",[]]]},{"id":"C1","b":"C","k":"op","rel":"L","t":"Set the offer dates","d":"Select the start and end dates. The classic form can constrain the selectable weekdays for a single day or date range.","sys":["Web Dash: Deals"],"e":[["A one day deal is inactive for its intended day","Promotion cannot be redeemed","H","CN",[]],["Restaurant midnight is calculated using the operator's time zone","Offer starts or ends on the wrong date","H","CX,T",[]]]},{"id":"C2","b":"C","k":"op","rel":"L","t":"Select days and hours","d":"Set the applicable weekdays and the hour window. Check eligibility at opening, closing and across a service day boundary.","sys":["Web Dash: Deals"],"e":[["An order exactly at the end time receives the expired price","Incorrect discount","C","M",[]],["Offer stays visible outside its chosen weekdays","Guests cannot complete an advertised offer","H","CX",[]]]},{"id":"C3","b":"C","k":"op","rel":"L","t":"Choose order sources","d":"The classic choices include POS with mPOS, Kiosk, QR and Website. Availability is calculated for the requesting order source.","sys":["Web Dash: Deals"],"e":[["A kiosk-only offer also appears online","Wrong channel gives a discount","C","M,CN",[]],["mPOS does not receive an offer selected under the shared POS label","Staff quote inconsistent prices","H","CN",[]]]},{"id":"C4","b":"C","k":"op","rel":"L","t":"Name and describe the deal","d":"Set a recognisable name, description, guest terms and optional images. The classic image field allows up to five images.","sys":["Web Dash: Deals"],"e":[["Duplicate name blocks saving after the operator completes the form","Rework before launch","M","CX",[]],["Guest description promises a different quantity from the configured reward","Offer disputes at checkout","H","CX",[]]]},{"id":"C5","b":"C","k":"op","rel":"L","t":"Configure a promo code","d":"When a code is enabled, check its availability and configure its permitted use. Verify typed and generated codes against the intended restaurant.","sys":["Web Dash: Deals"],"e":[["An existing code resolves to a different offer","Incorrect discount is applied","C","M,D",[]],["A limited-use code is accepted on two simultaneous checkouts after the last use","Restaurant gives excess discounts","C","M,T",[]]]},{"id":"D1","b":"D","k":"dec","rel":"L","t":"Ready to release?","d":"Review the terms, eligibility and placement. Save an unfinished offer as Draft or submit at the final step.","sys":["Web Dash: Deals"],"e":[["Preview price excludes a qualification shown only in configuration","Operator approves incorrect terms","H","CX",[]],["Incomplete settings survive submission as an active deal","Offer is unusable at checkout","H","CN",[]]]},{"id":"D2","b":"D","k":"op","rel":"L","t":"Resume a draft","d":"Locate the saved draft, restore the selected products and recheck availability before submission.","sys":["Web Dash: Deals"],"e":[["A selected menu item is deleted between draft and release","Guest has no eligible selection","H","D,CN",[]],["Draft reopens with wider scope than the saved subset","Discount is applied to too many items","C","M,D",[]]]},{"id":"D3","b":"D","k":"soft","rel":"L","t":"Activate now or schedule","d":"The service chooses Active or Scheduled based on the dates and schedules status transitions. Drafts do not schedule activation.","sys":["Web Dash: Deals"],"e":[["Scheduled start is missed while the deal remains Scheduled","Opening promotion is unavailable","H","T,CN",[]],["An earlier end event survives a schedule edit","Live deal stops early","H","T,D",[]]]},{"id":"D4","b":"D","k":"int","rel":"L","t":"Refresh available offers","d":"Deal availability depends on the offer dates, channel and linked campaign status. Android POS refreshes active, unarchived offers using the device date and time. A failed refresh puts the list into a failed state. For campaign-linked deals, all linked campaigns must meet the Active or Sent rule.","sys":["Web Dash: Deals","POS","mPOS","Kiosk","Online ordering"],"e":[["The register clock falls outside the offer window during a refresh","Staff may miss a valid deal or see it at the wrong time","H","M,CN",[]],["An active deal is missing from one ordering channel","Lost promotional orders","H","CN",[]],["One linked campaign is still in review when the restaurant expects its deal to appear","An otherwise active offer is missing","H","CN",[]]]},{"id":"E1","b":"E","k":"cust","rel":"L","t":"Open an online or QR offer","d":"Open the deal from a restaurant listing or link. The online details page can show an unavailable state when the offer cannot be claimed. Campaign audience groups are combined across groups, with alternatives allowed inside a group. The online ordering check omits spend.","sys":["Web Dash: Deals","Online ordering"],"e":[["Deep link opens a different restaurant or unavailable deal","Guest cannot claim the promotion","H","CN,CX",[]],["Listing advertises an offer whose only eligible item is unavailable","Guest discovers the issue late","H","CX",[]]]},{"id":"E2","b":"E","k":"cust","rel":"L","t":"Build a qualifying basket","d":"Select the qualifying items and rewards, or enter the promo code where required. Compare eligible value with the displayed minimum spend.","sys":["Web Dash: Deals"],"e":[["Removing a qualifying item leaves the free item discounted","Guest pays less than the configured price","C","M",[]],["Qualifying spend includes an ineligible line or fee","Offer triggers too early","C","M",[]]]},{"id":"E3","b":"E","k":"int","rel":"L","t":"Apply at a restaurant device","d":"On Android POS the cashier selects an offer in Deals and Discounts. The register checks offer terms and qualifying spend, then applies a ticket discount or opens item selection as appropriate. Check mPOS and Kiosk separately.","sys":["Web Dash: Deals","POS","mPOS","Kiosk"],"e":[["POS applies a deal the guest cannot see on the receipt","Staff cannot explain the bill","H","CN,CX",[]],["The register blocks the selected offer without making clear which existing discount conflicts with it","The cashier cannot tell which discount to remove","M","CX",[]]]},{"id":"E4","b":"E","k":"soft","rel":"L","t":"Calculate the discounted order","d":"On Android POS, compare the discount against the paid receipt. Item deals appear on the reward line and entire-ticket deals appear in the totals. For online orders, compare the buy, get and loyalty lines against the displayed total, tax and fees.","sys":["Web Dash: Deals","Online ordering","POS"],"e":[["Rebuilding an order summary subtracts an entire-order discount twice","Amount displayed differs from amount charged","C","M",[]],["Rounding across two discounted quantities changes tax or final cents","Receipt and payment disagree","C","M",[]]]},{"id":"E5","b":"E","k":"int","rel":"TBC","t":"Combine with other benefits","d":"On Android POS, check the offer terms when applying a deal to a ticket with an existing deal or discount. If the guest also uses a loyalty reward or pays by gift card, reconcile the reward line, the discount and the tender separately.","sys":["Web Dash: Deals","Marketing Gift cards","Marketing Loyalty","POS"],"e":[["A loyalty line receives a second unintended reduction","Restaurant pays twice for one reward","C","M,CN",[]],["Gift card tender is treated as another price discount","Balance due or tax is wrong","C","M,CN",[]]]},{"id":"E6","b":"E","k":"cust","rel":"L","t":"Complete or change the order","d":"If the cashier voids a qualifying item, Android POS rechecks the required items and minimum spend and can remove the deal. Compare the revised ticket and paid receipt. For a channel that accepts promo codes, check the remaining uses after a failed payment.","sys":["Web Dash: Deals","POS"],"e":[["Declined payment consumes the last permitted code use","Guest cannot retry a valid offer","H","M,D",[]],["Paid receipt shows the undiscounted total","Guest disputes the transaction","C","M,CX",[]]]},{"id":"F1","b":"F","k":"op","rel":"L","t":"Edit the offer","d":"Reopen the supported edit flow. Verify saved scope, dates and guest-facing copy after changing a deal.","sys":["Web Dash: Deals"],"e":[["New dates save while old availability remains on devices","Different prices for the same offer","C","M,CN",[]],["Editing one offer changes the terms on a historic receipt","Audit trail no longer matches payment","H","D,R",[]]]},{"id":"F2","b":"F","k":"op","rel":"L","t":"End a deal early","d":"End marks the deal complete and records the current end time. Check saved links, devices and attached marketing messages. Ending a campaign placement leaves its underlying deal subject to the deal status and dates.","sys":["Web Dash: Deals"],"e":[["Old campaign link still implies the promotion is redeemable","Guest sees an expired promise","H","CN,CX",[]],["A cart opened before ending retains the expired saving at payment","Restaurant funds a retired offer","C","M",[]]]},{"id":"F3","b":"F","k":"op","rel":"L","t":"Archive or restore the record","d":"Archive controls list visibility and eligibility. On restore, verify the underlying status and dates before promotion.","sys":["Web Dash: Deals"],"e":[["Restoring
