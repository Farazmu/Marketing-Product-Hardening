<meta charset="utf-8">
<title>Marketing Product Hardening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: a fixed header (sub-module switcher, tabs, path picker), a scrolling journey of lettered stages
   holding numbered step cards, and a detail drawer on the right. Tokens and type are inherited from the
   Online ordering and Catering hardening map so the two artifacts read as one family. */
:root {
  color-scheme: light;
  --bg: #F3F5F8; --surface: #FFFFFF; --soft: #F7F8FA; --ink: #18212C; --muted: #5C6674; --faint: #8D96A3; --line: #DFE3E9;
  --accent: #5640D2; --accent-soft: #EEEBFD;
  --op: #12858F; --cust: #C94F83; --softw: #2E68AC; --int: #B08714; --dec: #6B7480; --term: #2F7D52;
  --C: #C6342C; --H: #D9731F; --M: #C49B22; --L: #98A1AD; --C-soft: #FCECEB;
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #13171D; --surface: #1B2129; --soft: #20262F; --ink: #E7EBF0; --muted: #A2ACB8; --faint: #77818E; --line: #2D3540;
    --accent: #A391FF; --accent-soft: #29234A;
    --op: #5FC7D0; --cust: #E482AD; --softw: #73A9E6; --int: #DDB650; --dec: #A2ACB8; --term: #6DC394;
    --C: #F06A61; --H: #F09A50; --M: #E0C05C; --L: #7E8895; --C-soft: #3A2022;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #13171D; --surface: #1B2129; --soft: #20262F; --ink: #E7EBF0; --muted: #A2ACB8; --faint: #77818E; --line: #2D3540;
  --accent: #A391FF; --accent-soft: #29234A;
  --op: #5FC7D0; --cust: #E482AD; --softw: #73A9E6; --int: #DDB650; --dec: #A2ACB8; --term: #6DC394;
  --C: #F06A61; --H: #F09A50; --M: #E0C05C; --L: #7E8895; --C-soft: #3A2022;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }

header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 28px 0; }
.eyebrow { margin: 0 0 8px; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.chan { display: flex; flex-wrap: wrap; gap: 3px; padding: 4px; margin-bottom: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; width: fit-content; max-width: 100%; }
.chan button { flex: none; border: 0; background: none; padding: 6px 12px; border-radius: 9px; font-weight: 700; font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
.chan button:hover { color: var(--ink); }
.chan button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
h1 { margin: 0; font-size: 1.4rem; line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance; }
#sum { margin: 4px 0 12px; color: var(--muted); font-size: 0.92rem; }
#sum span { color: var(--faint); }
.bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 24px; }
.tabs { display: flex; gap: 22px; }
.tabs button { border: 0; background: none; padding: 8px 0 10px; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 700; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
.pathpick { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
.pathpick label { font-size: 0.86rem; color: var(--muted); white-space: nowrap; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 10px; }
#path { min-width: 260px; max-width: 70vw; }
#clear { border: 0; background: none; color: var(--accent); font-size: 0.88rem; padding: 4px 2px; }
.key { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 14px; padding-bottom: 12px; font-size: 0.8rem; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.kd { width: 10px; height: 10px; border-radius: 2px; display: inline-block; background: var(--dec); flex: none; }
.k-op.kd { background: var(--op); } .k-cust.kd { background: var(--cust); } .k-soft.kd { background: var(--softw); } .k-int.kd { background: var(--int); } .k-term.kd { background: var(--term); }

main { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
body.open main { grid-template-columns: minmax(0, 1fr) 440px; }
.scroll { overflow: auto; min-height: 0; padding: 20px 28px 60px; }

.stage { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-top: 1px solid var(--line); transition: opacity .15s; }
.stage:first-child { border-top: 0; padding-top: 4px; }
.stage.faded { opacity: 0.4; }
.stage-head h2 { margin: 0; font-size: 1rem; line-height: 1.3; }
.sid { color: var(--accent); margin-right: 8px; }
.stage-head p { margin: 4px 0 0; font-size: 0.84rem; color: var(--muted); }
.stage-head .sstat { color: var(--faint); font-size: 0.8rem; }
.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; }
.card { position: relative; width: 100%; height: 100%; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 11px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: inset 3px 0 0 var(--dec); transition: border-color .12s, opacity .15s; }
.card.k-op { box-shadow: inset 3px 0 0 var(--op); } .card.k-cust { box-shadow: inset 3px 0 0 var(--cust); } .card.k-soft { box-shadow: inset 3px 0 0 var(--softw); }
.card.k-int { box-shadow: inset 3px 0 0 var(--int); } .card.k-term { box-shadow: inset 3px 0 0 var(--term); }
.card:hover { border-color: var(--faint); }
.card.dim { opacity: 0.35; }
.card.on { border-color: var(--accent); }
.card.sel { border-color: var(--ink); border-width: 2px; padding: 9px 11px 10px 13px; }
.top { display: flex; justify-content: space-between; gap: 6px; font-size: 0.75rem; color: var(--faint); font-weight: 700; }
.top .kn { font-weight: 400; }
.rel { color: var(--accent); white-space: nowrap; }
.ct { font-weight: 700; font-size: 0.93rem; line-height: 1.3; flex: 1; }
.ce { font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 8px; }
.ce b { color: var(--C); }
.ce .tk { color: var(--accent); font-weight: 700; }
.num { position: absolute; top: -9px; left: -7px; background: var(--accent); color: var(--surface); font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 1px 7px; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notes { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 14px; max-width: 900px; }
.notes ul { margin: 10px 0 0; padding-left: 20px; color: var(--muted); font-size: 0.88rem; }
.notes li { margin: 5px 0; }

#drawer { overflow: auto; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); padding: 20px 22px 50px; position: relative; }
.x { position: absolute; top: 12px; right: 12px; border: 0; background: none; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; }
.x:hover { background: var(--soft); }
.back { border: 0; background: none; color: var(--accent); padding: 0; margin-bottom: 10px; font-size: 0.86rem; }
.kicker { margin: 0 36px 4px 0; font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 7px; }
#drawer h2 { margin: 0 36px 6px 0; font-size: 1.25rem; line-height: 1.25; }
.desc { margin: 0; color: var(--muted); font-size: 0.92rem; }
#drawer h3 { font-size: 0.95rem; margin: 22px 0 8px; }
.errs { list-style: none; margin: 0; padding: 0; }
.errs > li { padding: 8px 0 8px 12px; border-left: 3px solid var(--L); margin-bottom: 8px; }
.errs > li.sev-C { border-color: var(--C); } .errs > li.sev-H { border-color: var(--H); } .errs > li.sev-M { border-color: var(--M); }
.sv { font-size: 0.74rem; font-weight: 700; color: var(--muted); }
.sev-C .sv { color: var(--C); } .sev-H .sv { color: var(--H); }
.bk { font-size: 0.74rem; color: var(--faint); margin-left: 8px; }
.et { margin: 1px 0 2px; font-weight: 700; font-size: 0.9rem; line-height: 1.35; }
.ei { margin: 0; font-size: 0.85rem; color: var(--muted); }
.tix { list-style: none; margin: 7px 0 0; padding: 0; display: grid; gap: 4px; }
.tix li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 6px 9px; background: var(--soft); border-radius: 8px; font-size: 0.8rem; }
.tix a { font-weight: 700; text-decoration: none; font-variant-numeric: tabular-nums; }
.tix a:hover { text-decoration: underline; }
.tstat { font-weight: 700; color: var(--muted); }
.tstat::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 5px; }
.g-res { color: var(--term); } .g-closed { color: var(--dec); } .g-prog { color: var(--int); } .g-new { color: var(--softw); } .g-road { color: var(--accent); }
.tmeta { color: var(--faint); }
.ttl { flex-basis: 100%; color: var(--muted); overflow-wrap: anywhere; }
.nav { list-style: none; margin: 0; padding: 0; }
.nav button { width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 8px; font-size: 0.9rem; }
.nav button:hover { background: var(--soft); }
.nav button span { display: block; font-size: 0.8rem; color: var(--muted); }
details { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; }
.lbl { margin: 14px 0 4px; font-size: 0.8rem; font-weight: 700; color: var(--faint); }
details .muted { margin: 0; font-size: 0.86rem; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 12px 0 0; font-size: 0.86rem; color: var(--muted); }
.stats b { color: var(--ink); font-size: 1.15rem; margin-right: 3px; font-variant-numeric: tabular-nums; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps button { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 6px; border-radius: 8px; font-size: 0.9rem; }
.steps button:hover { background: var(--soft); }
.steps .i { color: var(--faint); text-align: right; }
.steps .n { color: var(--muted); font-size: 0.82rem; }

.ebar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
#q { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; width: min(300px, 100%); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 0.84rem; }
.chip span { color: var(--muted); margin-left: 3px; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip.tixchip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip.tixchip[aria-pressed="false"] { opacity: 1; }
.ebar p { margin: 0; font-size: 0.88rem; }
.twrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 0.9rem; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
thead th { font-size: 0.8rem; color: var(--muted); position: sticky; top: 0; background: var(--surface); }
tr.grp th { background: var(--soft); font-size: 0.92rem; }
tr[data-node] { cursor: pointer; } tr[data-node]:hover { background: var(--soft); }
.tstep { font-weight: 700; width: 200px; }
.tty { width: 150px; font-size: 0.82rem; color: var(--muted); }
td .tix li { background: none; padding: 0; }
td .ttl { display: none; }
.pill { font-size: 0.78rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.pill.sev-C { color: var(--C); } .pill.sev-H { color: var(--H); }

@media (max-width: 1100px) {
  body.open main { grid-template-columns: minmax(0, 1fr); }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 94vw); z-index: 10; box-shadow: -10px 0 40px rgba(0,0,0,.18); padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .stage { grid-template-columns: minmax(0, 1fr); gap: 10px; }
}
@media (max-width: 640px) {
  header { padding: 12px 16px 0; } .scroll { padding: 14px 16px 50px; }
  h1 { font-size: 1.15rem; }
  .chan { flex-wrap: nowrap; overflow-x: auto; width: auto; }
  .key { display: none; }
  #path { min-width: 0; width: 100%; }
  .pathpick { width: 100%; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  #drawer { top: auto; height: 72vh; width: 100%; border-left: 0; border-radius: 16px 16px 0 0; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header>
  <p class="eyebrow">AIO Product Hardening &middot; Marketing module</p>
  <div class="chan" role="tablist" aria-label="Marketing sub-module" id="chan"></div>
  <h1 id="ttl"></h1>
  <p id="sum"></p>
  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="journey">Journey</button>
      <button role="tab" data-tab="errors">All errors</button>
    </div>
    <div class="pathpick">
      <label for="path">Trace a path</label>
      <select id="path"></select>
      <button id="clear" data-act="clear">Clear</button>
    </div>
    <div class="key" aria-label="Legend">
      <span><i class="kd k-op"></i>Operator</span><span><i class="kd k-cust"></i>Guest</span><span><i class="kd k-soft"></i>Software</span><span><i class="kd k-int"></i>Integration</span><span><i class="kd"></i>&#9670; Decision</span><span><i class="kd k-term"></i>Start or end</span>
    </div>
  </div>
</header>
<main>
  <div class="scroll">
    <div id="journey"></div>
    <div id="errors" hidden></div>
  </div>
  <aside id="drawer" hidden aria-live="polite"></aside>
</main>
<script>
const CHANNEL_ORDER = ["overview","guestbook","reviews","campaigns","journeys","menuboards","website","brandbook","deals","spotlights","loyalty","giftcards"];
const CHANNELS = {"overview":{"name":"Overview","title":"Overview: operator and guest paths and what can go wrong","BANDS":[{"id":"A","t":"Set the reporting context","s":"Choose the restaurant and reporting dates before comparing figures."},{"id":"B","t":"Measure campaign delivery and engagement","s":"Compare email and text campaign results for the selected restaurant and period."},{"id":"C","t":"Inspect guest and sales cards","s":"Check the definition and scope of each operational measure."},{"id":"D","t":"Reconcile with the source","s":"Follow the card into its module and investigate differences."}],"NODES":[{"id":"A1","b":"A","k":"term","rel":"L","t":"Open Marketing Overview","d":"The operator opens Overview for the selected business and restaurant.","sys":["Web Dash: Overview"],"e":[["Figures from the previous location remain on screen during a switch","Operator reports on the wrong restaurant","H","R,D",[]]]},{"id":"A2","b":"A","k":"op","rel":"L","t":"Choose a reporting period","d":"Most businesses start on Last 7 days. Today, Last month, Last year, All time and a custom range are available.","sys":["Web Dash: Overview"],"e":[["Business switch restores the default period during a comparison","Dates change unnoticed","M","R,CX",[]],["All time appears selected while a previous date remains active","Lifetime totals appear too low","H","R",[]]]},{"id":"A3","b":"A","k":"soft","rel":"L","t":"Resolve the business dates","d":"The date picker blocks future dates. Several statistics use the restaurant closeout time to define the reporting day.","sys":["Web Dash: Overview"],"e":[["Orders taken after midnight move into the wrong trading day","Daily figures disagree with sales","H","R,CN",[]],["A custom range excludes its last service period","End date appears incomplete","H","R",[]]]},{"id":"B1","b":"B","k":"op","rel":"TBC","internalOnly":true,"t":"Inspect campaigns sent","d":"The card counts launched message campaigns for the restaurant in the selected dates. Changing the reporting period refreshes the figures and their prior period comparison.","sys":["Web Dash: Overview","Marketing Campaigns","Marketing Journeys"],"e":[["A campaign launched near midnight falls into the wrong local date","The period comparison shifts by one campaign","H","R",[]],["The selected dates persist while the restaurant changes","The operator compares different audiences","H","R",[]]]},{"id":"B2","b":"B","k":"op","rel":"TBC","internalOnly":true,"t":"Interpret guests reached","d":"Guests reached counts distinct guest records with a delivered campaign email or a delivered or read campaign text. A guest reached through both channels counts once. Journey sends are excluded.","sys":["Web Dash: Overview","Marketing Campaigns","Marketing Journeys"],"e":[["Two guest profiles for one person both receive the promotion","Reach can exceed the number of people","H","R",[]],["Delivery updates arrive after the operator reads the card","Reach initially looks lower than the final result","H","R",[]]]},{"id":"B3","b":"B","k":"op","rel":"TBC","internalOnly":true,"t":"Inspect engagement, recent sends and usage","d":"Email open rate uses human opens on delivered emails. SMS click rate uses delivered texts with a tracked link. Recent lists the latest three launched message campaigns at this location independently of the selected dates. A connected SMS account can open the usage drawer.","sys":["Web Dash: Overview","Marketing Campaigns","Marketing Journeys"],"e":[["Missing historical tracking appears as zero engagement","The restaurant judges an unmeasured send as ineffective","H","R",[]],["An operator treats the recent list as filtered by the selected dates","Campaigns outside the period appear to contradict the totals","M","R",[]]]},{"id":"C1","b":"C","k":"op","rel":"L","t":"Inspect guest segments","d":"New, Occasional, Regular, Lost and Potential cards use guest records for the location and the selected period.","sys":["Web Dash: Overview","Guestbook / CRM"],"e":[["Changing segment rules shifts the mix for the same period","Trend misinterpreted as guest churn","H","R,D",[]],["A guest with no qualifying visit disappears from a comparison","Potential audience understated","M","R",[]]]},{"id":"C2","b":"C","k":"op","rel":"L","t":"Filter deal performance","d":"Deals sold and Revenue are paired with active and complete deal series. The card supports filtering and sorting.","sys":["Web Dash: Overview","Marketing Deals"],"e":[["Limits on number sold hide a deal while the operator interprets the chart as all deals","Top performers misidentified","H","R",[]],["An archived deal disappears from a historical comparison","Past promotion appears weaker","H","R,D",[]]]},{"id":"C3","b":"C","k":"op","rel":"L","t":"Check review activity","d":"The reputation card shows the location rating, review volume, replied and unreplied measures. Filter by source and compare with the prior period. The tile labelled Total reviews uses the new reviews figure.","sys":["Web Dash: Overview"],"e":[["A disconnected source stops contributing new reviews","Silence mistaken for a quality improvement","H","R,CN",[]],["A reply posted after the selected period changes how a historic review is read","Reply performance misinterpreted","M","R",[]],["The Total reviews tile is interpreted as lifetime volume although it shows new reviews in the selected period","Restaurant misreads review growth","H","R,CX",[]]]},{"id":"C4","b":"C","k":"op","rel":"TBC","internalOnly":true,"t":"Read gift card values","d":"The selected restaurant and its closeout dates scope purchased, redeemed and imported value. Purchases include reloads and purchase refunds. Redemption reversals reduce redeemed value. Unclaimed is purchased less redeemed plus imported for the selected window.","sys":["Web Dash: Overview","Marketing Gift cards"],"e":[["Unspent balances are counted as new sales","Restaurant overstates period revenue","H","M,R",[]],["A chart with no positive slices looks like no cards were sold","Sales omitted from discussion","M","R,CX",[]],["A location or closeout boundary differs between reports","The operator cannot reconcile the same trading period","H","R",[]]]},{"id":"C5","b":"C","k":"op","rel":"L","t":"Read loyalty activity","d":"The card shows Total Sign-ups, Points redeemed and Points earned. Loyalty statistics use the restaurant and date range. A disabled programme can return zeros.","sys":["Web Dash: Overview","Marketing Loyalty"],"e":[["Disabled loyalty looks like an enabled programme with no participation","Operator investigates the wrong problem","M","OB,R",[]],["Points issued and redeemed are compared as if both were cash","Liability misreported","H","M,R",[]]]},{"id":"D1","b":"D","k":"op","rel":"L","t":"Open the underlying module","d":"Each card links to its own module. Check the destination location, period, filters and metric definition before comparing totals.","sys":["Web Dash: Overview"],"e":[["Destination opens with its default period","Valid figures appear inconsistent","H","R,CX",[]],["A linked module has different access requirements","Manager cannot investigate the total","M","S,CX",[]]]},{"id":"D2","b":"D","k":"term","rel":"L","t":"Record the comparison","d":"Record the measure, location, dates and source values when escalating a discrepancy.","sys":["Web Dash: Overview"],"e":[["A screenshot omits the range and card filters","Support cannot reproduce the discrepancy","M","R,CX",[]]]}],"EDGES":[["A1","A2",""],["A2","A3",""],["A3","B1",""],["B1","B2",""],["B2","B3",""],["B3","D1",""],["D1","D2",""],["A3","C1",""],["C1","D1",""],["A3","C2",""],["C2","D1",""],["A3","C3",""],["C3","D1",""],["A3","C4",""],["C4","D1",""],["A3","C5",""],["C5","D1",""]],"PATH_GROUPS":["Campaign performance","Card reconciliation"],"PATHS":[{"id":"P02","g":1,"t":"Reconcile the guest mix","n":"Compare the segment cards with Guest Book.","s":"A1 A2 A3 C1 D1 D2","side":""},{"id":"P03","g":1,"t":"Investigate deal revenue","n":"Apply deal filters and compare the listed offers.","s":"A1 A2 A3 C2 D1 D2","side":""},{"id":"P04","g":1,"t":"Check a review source","n":"Follow review activity into Review Management.","s":"A1 A2 A3 C3 D1 D2","side":""},{"id":"P05","g":1,"t":"Check outstanding gift value","n":"Compare redeemed and unclaimed amounts with Gift Cards.","s":"A1 A2 A3 C4 D1 D2","side":""},{"id":"P06","g":1,"t":"Check programme uptake","n":"Compare sign-ups and points with Loyalty.","s":"A1 A2 A3 C5 D1 D2","side":""},{"id":"P01","g":0,"t":"Reconcile campaign reach and engagement","n":"Compare the selected period with campaign delivery records, then check the dates on the recent list.","s":"A1 A2 A3 B1 B2 B3 D1 D2","side":""}],"NOTES":["The internal route mounts six cards. Campaign delivery and gift card figures use the selected location. The earlier production reference has five cards. Restaurant rollout was not verified.","Recent campaigns are selected independently of the period. Email opens exclude privacy prefetches and likely bots. SMS click rate excludes texts without a link.","No ticket in the supplied snapshot specifically identifies a failure on these Overview cards.","Zeus internal, 02473c3bac9. See Marketing/Overview, marketing/campaign/campaign-metrics.service.ts and the gift card dashboard statistics service."]},"guestbook":{"name":"Guest Book","title":"Guest Book: operator and guest paths and what can go wrong","BANDS":[{"id":"A","t":"Choose the restaurant and entry point","s":"A guest can arrive through staff entry, commerce or an import."},{"id":"B","t":"Identify the guest","s":"Match contact details and keep purchases with the correct person."},{"id":"C","t":"Import records","s":"Validate the file, track partial progress and recover rejected rows."},{"id":"D","t":"Find and inspect a guest","s":"Use segments, filters and individual records to answer operator questions."},{"id":"E","t":"Configure audiences","s":"Maintain segment rules, spending bands and guest attributes."},{"id":"F","t":"Use and maintain the record","s":"Carry permissions, preferences and balances into the products that use them."}],"NODES":[{"id":"A1","b":"A","k":"term","rel":"L","t":"Open Guest Book","d":"Choose the restaurant and open Guest Book Overview or Configure.","sys":["Web Dash: Guest Book"],"e":[["Counts from another location remain visible during a switch","Manager picks the wrong audience","H","R,D",[]]]},{"id":"A2","b":"A","k":"op","rel":"L","t":"Add a guest manually","d":"Add guest takes a US phone number and accepts email and birthday. The form supplies the country prefix.","sys":["Web Dash: Guest Book"],"e":[["A national number already containing a prefix is entered twice","Valid guest cannot be saved","M","CX",[]],["An incorrect birthday is accepted as a genuine date","Birthday message arrives on the wrong day","H","CN,D",[]]]},{"id":"A3","b":"A","k":"cust","rel":"L","t":"Identify during an order","d":"At the Android register, staff look up a guest by phone and attach the matching profile to the ticket, or enter the details for a new guest. A temporary ticket name identifies the order. Online ordering, receipt contact and card matching are separate entry points.","sys":["Web Dash: Guest Book","Online ordering","POS","Kiosk"],"e":[["A family shares a phone and one person's visit attaches to another","Visit history becomes unreliable","H","D",[]],["A receipt contact is treated as permission to send promotions","Guest gets unwanted marketing","C","L,CN",[]]]},{"id":"A4","b":"A","k":"int","rel":"L","t":"Receive a loyalty or card event","d":"Loyalty transactions update guest activity. Gift card purchaser and recipient can be different people, so check whose card and history appear.","sys":["Web Dash: Guest Book","Marketing Gift cards","Marketing Loyalty"],"e":[["A gifted card appears under the buyer instead of the intended recipient","Wrong guest sees stored value","C","S,D",[]],["Guest receives loyalty credit under a temporary payment profile","Balance appears missing","H","M,D",[]]]},{"id":"A5","b":"A","k":"int","rel":"L","t":"Submit a website popup","d":"Newsletter, Sign Up and Contact Us popups can create or link a guest and assign the Potential segment. The guest update can fail after the visitor receives confirmation of the form submission.","sys":["Web Dash: Guest Book","Website builder"],"e":[["A form submission is counted as a marketable guest without a matching opt in","Unwanted contact","C","L,CN",[]],["Guest Book update fails after the website accepts a submission","A real lead is missing from the audience","H","D,CN",[]]]},{"id":"B1","b":"B","k":"soft","rel":"L","t":"Match phone or email","d":"At the Android register, the Add Guest phone lookup displays the matched contact before staff attach it to the ticket. Payment and import services have their own matching rules, including email fallback where supported. Manual creation can reject an existing email or phone.","sys":["Web Dash: Guest Book","POS"],"e":[["Formatting variants create two entries for one person","Orders and points are split","H","D,M",[]],["A reused phone conflicts with an existing email identity","A guest is linked to the wrong person","C","S,D",[]]]},{"id":"B2","b":"B","k":"soft","rel":"L","t":"Link the restaurant record","d":"A customer identity and its association with the restaurant are separate. Check that the local association exists when an existing guest orders at a new branch.","sys":["Web Dash: Guest Book"],"e":[["A recognised customer has no link to the new branch","Staff cannot find the guest","H","OB,D",[]],["A contact change propagates to an unrelated profile","Wrong person receives follow-up","C","S,D",[]]]},{"id":"B3","b":"B","k":"soft","rel":"L","t":"Resolve payment identity","d":"The payment service can merge a card-created guest into an identified ticket customer. Android POS resolves the receipt name from the ticket and linked customer fields and suppresses recognised placeholder names. Compare the receipt with the attached profile.","sys":["Web Dash: Guest Book","POS","CFD"],"e":[["Temporary and identified records both keep the same visit","Spend and visit count inflate","H","M,R",[]],["A placeholder name reaches the printed receipt after a change to receipt formatting","Guest sees an incorrect identity","H","CN,CX",["4966"]]]},{"id":"B4","b":"B","k":"op","rel":"L","t":"Handle an incorrect guest name","d":"When Android POS finds a returning guest, the cashier sees the saved name and attaches the profile by customer ID. This flow has no name-edit field. A temporary ticket name and a correction to the saved Guest Book profile are separate actions.","sys":["Web Dash: Guest Book","POS"],"e":[["A returning guest asks to correct their name and the cashier can only attach the existing profile from this screen","The stored name still needs correction in Guest Book","M","CN,CX",["5045"]],["Correcting a shared contact changes the wrong guest name","Subsequent receipts identify the wrong person","H","D,CX",[]]]},{"id":"C1","b":"C","k":"op","rel":"L","t":"Choose the import source","d":"In Configure, open the Guest Book import drawer and select the platform whose column layout matches the file.","sys":["Web Dash: Guest Book"],"e":[["A loyalty upload is interpreted as a guest file","Expected customers are rejected","H","OB,D",[]],["Progress for a loyalty import appears as guest import progress","Operator waits for the wrong job","M","CX",[]]]},{"id":"C2","b":"C","k":"op","rel":"L","t":"Select and validate the file","d":"The drawer advertises CSV and Excel up to 5 MB. The server checks the platform columns and whether any valid customers remain.","sys":["Web Dash: Guest Book"],"e":[["Wrong headers reject the file before the first row is saved","Migration delayed","H","OB",[]],["A spreadsheet converts a phone number or strips leading digits","Rows no longer match existing contacts","H","D",[]]]},{"id":"C3","b":"C","k":"soft","rel":"L","t":"Validate individual rows","d":"Normalisation separates accepted rows, invalid records and duplicates before or during processing, depending on the source format.","sys":["Web Dash: Guest Book"],"e":[["Repeated contacts within the upload inflate successful counts","Migration looks more complete than it is","H","D,R",[]],["Rows with no usable contact details appear eligible","Unreachable guests enter targeting","H","CN,D",[]]]},{"id":"C4","b":"C","k":"soft","rel":"L","t":"Apply imported preferences","d":"Import uses source-specific subscription data when supplied. Eligibility must be checked independently for email and marketing texts. A qualifying points import can also trigger a separate loyalty welcome text after the row commits.","sys":["Web Dash: Guest Book"],"e":[["A missing SMS preference becomes an explicit opt in","Guests receive texts without consent","C","L,D",[]],["Reimport replaces a recorded opt out with an older preference","Previously suppressed guest is contacted","C","L,CN",[]]]},{"id":"C5","b":"C","k":"op","rel":"L","t":"Track or cancel an import","d":"Inspect the current restaurant and import type. Cancellation can occur after some records have been processed.","sys":["Web Dash: Guest Book"],"e":[["Cancel is interpreted as undoing completed rows","Operator repeats previously imported records","H","D,CX",[]],["Progress remains active after a worker stops","Manager cannot tell which rows completed","H","OB,T",[]]]},{"id":"C6","b":"C","k":"op","rel":"L","t":"Download and correct conflicts","d":"Review the failed records file, correct the source rows and retry only the affected entries.","sys":["Web Dash: Guest Book"],"e":[["The failure file omits the original row or conflict","Valid guests remain missing","H","D,CX",[]],["Retrying the complete file obscures which rows were already accepted","Counts no longer reconcile","M","R,D",[]]]},{"id":"D1","b":"D","k":"op","rel":"L","t":"Find the guest","d":"Search the list, inspect segment cards, sort and load additional rows. The name or contact may differ from the original import.","sys":["Web Dash: Guest Book"],"e":[["A retained segment excludes the matching phone number","Staff create another record","H","D,CX",[]],["Pagination repeats the final row after a sort change","Operator overlooks a guest","M","CX",[]]]},{"id":"D2","b":"D","k":"op","rel":"L","t":"Apply guest filters","d":"Apply guest attributes and order or spend ranges. The date filter starts at All time and can combine with a selected segment.","sys":["Web Dash: Guest Book"],"e":[["Date and count filters together hide a recent guest","Operator assumes an import failed","M","CX",[]],["Clearing visible filters leaves a separate segment active","Audience size stays unexpectedly small","M","CX,R",[]]]},{"id":"D3","b":"D","k":"op","rel":"L","t":"Open the profile","d":"Open a row to load the guest and restaurant together. Overview and Activity are distinct profile tabs.","sys":["Web Dash: Guest Book"],"e":[["Switching guests briefly displays the previous person's contact details","Private information is misattributed","C","S,D",[]],["A failed profile lookup looks like a guest with no activity","Staff incorrectly rebuild the profile","M","CX",[]]]},{"id":"D4","b":"D","k":"op","rel":"L","t":"Check identity and attributes","d":"Inspect the displayed name, contact details, birthday, tags and loyalty or gift card summary where available.","sys":["Web Dash: Guest Book"],"e":[["Outdated email remains after profile correction","Next email reaches an old address","H","CN,D",[]],["A missing balance is rendered as a genuine zero","Staff give incorrect advice","H","M,CX",[]]]},{"id":"D5","b":"D","k":"op","rel":"L","t":"Inspect orders and activity","d":"Activity includes order history with date, order number and total spend. Open an available order detail and match it to the original ticket.","sys":["Web Dash: Guest Book"],"e":[["A refund is shown as a second positive purchase","Spend and visit history are overstated","H","M,R",[]],["Gift card purchase value is confused with food order spend","Guest value is overstated","H","M,R",[]]]},{"id":"D6","b":"D","k":"op","rel":"TBC","internalOnly":true,"t":"Review loyalty, cards and receipts","d":"Open the guest profile to see rewards and the cards linked at this restaurant. For a self-purchase inspect the buyer. For a gift inspect the linked recipient. Open card activity and any available receipt, including separate purchase and refund events.","sys":["Web Dash: Guest Book","Marketing Gift cards","Marketing Loyalty"],"e":[["Points from a reversed order remain in the summary","Guest expects unavailable rewards","H","M,CN",[]],["A gift is checked against the buyer while it belongs to the linked recipient","Support reports a missing card","H","R,CX",[]]]},{"id":"E1","b":"E","k":"op","rel":"L","t":"Set segment rules","d":"Configure the visit or inactivity criteria for the available guest segments. Review the thresholds used by Regular and Lost journeys.","sys":["Web Dash: Guest Book"],"e":[["Shortening the lost threshold moves many guests into reminders at once","Unexpected sending volume","H","CN,B",[]],["Threshold change is saved for the wrong restaurant","Local audiences are redefined","H","D",[]]]},{"id":"E2","b":"E","k":"op","rel":"L","t":"Set average spend bands","d":"Configure Economy, Standard and the higher spend band. Validate adjacent monetary boundaries and decimals before saving.","sys":["Web Dash: Guest Book"],"e":[["A guest exactly at the boundary is counted twice","Target groups overlap","H","M,D",[]],["Spend fields save while a separate segment update fails","Operator believes all settings took effect","H","D,CX",[]]]},{"id":"E3","b":"E","k":"soft","rel":"L","t":"Update classifications","d":"Segment and spend calculations use restaurant activity. Compare the guest profile, segment count and downstream audience after a change.","sys":["Web Dash: Guest Book"],"e":[["The card updates before individual guest memberships","Displayed and actual audience sizes differ","H","D,R",[]],["A refunded or cancelled order still qualifies a guest for a spend tier","Wrong guests receive offers","H","M,CN",[]]]},{"id":"E4","b":"E","k":"op","rel":"L","t":"Inspect tags and allergens","d":"Review the available tag and allergen groups and their association with the selected guest. Campaign filters can consume them.","sys":["Web Dash: Guest Book"],"e":[["Removing a tag leaves a saved audience unexpectedly empty","Campaign misses its target group","H","CN,D",[]],["An allergen label from another guest appears on the profile","Staff use incorrect guest information","H","D,CX",[]]]},{"id":"F1","b":"F","k":"soft","rel":"L","t":"Check channel consent","d":"Email subscription and promotional SMS consent are recorded separately. On the Android customer-facing loyalty signup, the guest chooses whether to receive promotions and the app sends that choice with the signup. A phone number supplied for a receipt alone does not establish that choice.","sys":["Web Dash: Guest Book","CFD"],"e":[["A phone captured for a receipt is included in a promotional audience","Unconsented marketing text","C","L,CN",[]],["Email opt out also suppresses an unrelated permitted channel","Guest misses requested messages","H","CN",[]]]},{"id":"F2","b":"F","k":"int","rel":"L","t":"Resolve marketing audiences","d":"Campaigns snapshot eligible guests when submitted. Journeys evaluate their own trigger and channel eligibility. Reconcile the time of selection.","sys":["Web Dash: Guest Book","Marketing Campaigns","Marketing Journeys"],"e":[["A manager compares a saved campaign with today's larger segment","Audience appears incomplete","M","R,CN",[]],["A guest who changed segment still enters an inappropriate reminder","Guest receives an irrelevant offer","H","CN,D",[]]]},{"id":"F3","b":"F","k":"cust","rel":"TBC","internalOnly":true,"t":"Withdraw marketing consent","d":"The guest can unsubscribe from email or change marketing SMS consent by reply. The SMS worker uses the provider decision or recognised STOP, START or UNSTOP text, and writes the matched guest and restaurant preference. Check the next send independently.","sys":["Web Dash: Guest Book","Twilio","Email service"],"e":[["A later import re-enables the withdrawn channel","Marketing resumes against the guest's preference","C","L,D",[]],["An already queued send uses an earlier consent snapshot","Opted out guest still receives a message","C","L,CN",[]]]},{"id":"F4","b":"F","k":"op","rel":"TBC","t":"Handle a privacy request","d":"Verify the authorised route for correction, access or erasure of a guest record and its downstream copies. The Guest Book controller inspected exposes no operator erasure flow.","sys":["Web Dash: Guest Book"],"e":[["Staff remove a profile from a visible list while a downstream copy remains contactable","Privacy request is incomplete","C","L,D",[]],["A shared phone is treated as proof of identity for erasure","Another guest loses their history","C","S,D",[]]]},{"id":"F5","b":"F","k":"term","rel":"L","t":"Verify the guest outcome","d":"Recheck the intended restaurant, guest and destination surface after a change or import.","sys":["Web Dash: Guest Book"],"e":[["Only a list count is verified after merging profiles","Points or history remain attached to the wrong person","H","M,D",[]]]},{"id":"C7","b":"C","k":"soft","rel":"TBC","internalOnly":true,"t":"Send an imported points welcome","d":"After a committed import with positive points, check whether the guest is reachable, has previously been welcomed, and qualifies as new, previously at zero points, or without a ticket. Record an accepted welcome so a later import can skip it.","sys":["Guest Book import","Loyalty","SMS"],"e":[["An accepted welcome is not recorded before an import is retried","The guest may receive a duplicate balance message","H","CX",[]],["An imported guest has points but no reachable number","The balance is recorded without a welcome text","M","CX",[]]]}],"EDGES":[["A1","A2",""],["A2","B1",""],["B1","B2",""],["B2","D1",""],["D1","D3",""],["D3","D4",""],["D4","F5",""],["A1","A3",""],["A3","B1",""],["B2","B3",""],["B3","B4","Name needs correction"],["B4","D1",""],["D3","D5",""],["D5","F5",""],["A1","A4",""],["A4","B1",""],["D3","D6",""],["D6","F5",""],["A1","A5",""],["A5","D1",""],["D1","F5",""],["A1","C1",""],["C1","C2",""],["C2","C3",""],["C3","C4",""],["C4","C5",""],["C5","D1",""],["D3","F5",""],["C5","C6",""],["C6","C2",""],["C6","D1",""],["A1","D1",""],["D1","D2",""],["D2","D1",""],["D4","D5",""],["A1","E1",""],["E1","E2",""],["E2","E3",""],["E3","E4",""],["E4","D1",""],["D3","F1",""],["F1","F2",""],["F2","F5",""],["F1","F3",""],["F3","F1",""],["D3","F4",""],["F4","F5",""],["A5","B1",""],["C4","C7","Eligible points import"],["C7","D3",""],["B3","D1","Name is correct"]],"PATH_GROUPS":["Capture and identity","Imports","Profiles and targeting"],"PATHS":[{"id":"P01","g":0,"t":"Create a guest in Web Dash","n":"Add a guest and confirm the resulting local profile.","s":"A1 A2 B1 B2 D1 D3 D4 F5","side":""},{"id":"P02","g":0,"t":"Identify a returning guest at checkout","n":"Match the guest and reconcile a payment profile and receipt.","s":"A1 A3 B1 B2 B3 D1 D3 D5 F5","side":""},{"id":"P03","g":0,"t":"Review loyalty and gift card ownership","n":"Check a commerce event against the intended guest and balance.","s":"A1 A4 B1 B2 D1 D3 D6 F5","side":""},{"id":"P04","g":0,"t":"Verify a form submission","n":"Trace an eligible popup submission to its guest record and restaurant association.","s":"A1 A5 B1 B2 D1 D3 F5","side":""},{"id":"P05","g":1,"t":"Import a clean file","n":"Validate source, preferences and the resulting profiles.","s":"A1 C1 C2 C3 C4 C5 D1 D3 F5","side":""},{"id":"P06","g":1,"t":"Recover rejected records","n":"Inspect a partial result, correct the failures and retry.","s":"A1 C1 C2 C3 C4 C5 C6 C2 C3 C4 C5 D1 F5","side":""},{"id":"P07","g":1,"t":"Cancel a running import","n":"Check which rows survived cancellation before retrying.","s":"A1 C1 C2 C3 C4 C5 C6 D1 F5","side":""},{"id":"P08","g":2,"t":"Investigate a missing guest","n":"Clear filters and reconcile activity on the selected profile.","s":"A1 D1 D2 D1 D3 D4 D5 F5","side":""},{"id":"P09","g":2,"t":"Change targeting rules","n":"Save segment and spend rules, then check affected campaign and journey audiences.","s":"A1 E1 E2 E3 E4 D1 D3 F1 F2 F5","side":""},{"id":"P10","g":2,"t":"Verify an opt out","n":"Trace a preference change into the next selection of recipients.","s":"A1 D1 D3 F1 F3 F1 F2 F5","side":""},{"id":"P11","g":2,"t":"Handle a privacy request","n":"Check the correct identity and determine the supported fulfilment route.","s":"A1 D1 D3 F4 F5","side":""},{"id":"P12","g":0,"t":"Import points and verify the welcome","n":"Check the completed guest row, the separate welcome and the resulting balance.","s":"C1 C2 C3 C4 C7 D3 D6","side":""},{"id":"P13","g":0,"t":"Returning guest reports an incorrect name","n":"Identify the existing profile at the register, then check the stored name in Guest Book.","s":"A1 A3 B1 B2 B3 B4 D1 D3 D4 F5","side":""}],"NOTES":["Gift card activity in the profile reads transaction records. A loyalty welcome following an eligible import is transactional. Marketing text eligibility still depends on the guest consent record.","Android POS internal d2b5329 was checked in AddCustomerFragment, TicketReceiptMapper and the customer-facing loyalty signup. Payment identity merges, privacy requests and cancellation of an in-flight import depend on their respective services. Three website popup types create guests.","PROD 5045 is a request for an existing-name edit on POS. PROD 4966 documents the dummy guest on a receipt and also appears in Loyalty.","Zeus internal, 02473c3bac9. See features/guestbook, components/guestbook/overview/profile/GiftCardsDrawer.tsx and jobs/guests/import-loyalty-sms.ts."]},"reviews":{"name":"Review Management","title":"Review Management: operator and guest paths and what can go wrong","BANDS":[{"id":"A","t":"Connect review sources","s":"Match provider accounts and listings to the restaurant."},{"id":"B","t":"Collect guest feedback","s":"Follow submission, collection and stale feed recovery."},{"id":"C","t":"Work the inbox","s":"Find the right review and choose how to respond."},{"id":"D","t":"Publish and verify replies","s":"Check what the guest and operator can see."},{"id":"E","t":"Evaluate and maintain","s":"Review insights, mobile summaries and connection changes."}],"NODES":[{"id":"A1","b":"A","k":"term","rel":"L","t":"Open Review Management","d":"Open the restaurant review workspace and inspect the onboarding or overview state.","sys":["Web Dash: Review Management"],"e":[["An established restaurant lands back on first use","Operator repeats setup","M","OB",[]],["Old location counts remain after switching restaurants","Incorrect reputation figures","H","D,R",[]]]},{"id":"A2","b":"A","k":"op","rel":"L","t":"Connect Google Business Profile","d":"Authorise Google and select the business location. A connected account also needs a stored location before the first fetch.","sys":["Web Dash: Review Management","Google Business Profile"],"e":[["Operator has access to the account but selects the wrong listing","Another location supplies the reviews","H","OB,CN",[]],["Permission is revoked after authorisation","Fresh reviews stop arriving","H","OB,T",[]]]},{"id":"A3","b":"A","k":"op","rel":"L","t":"Connect Yelp","d":"Select the Yelp business for this restaurant and check the displayed business name. Fetch readiness requires the stored listing.","sys":["Web Dash: Review Management","Yelp"],"e":[["Two similarly named branches are confused","Reviews attributed to the wrong branch","H","OB,CN",[]],["Connected indicator appears before the selected location is saved","Fetch remains unavailable","M","OB,CX",[]]]},{"id":"A4","b":"A","k":"op","rel":"L","t":"Connect Tripadvisor","d":"Use the Tripadvisor connection flow for the selected restaurant. It can contribute reviews independently of the other sources.","sys":["Web Dash: Review Management","Tripadvisor"],"e":[["Wrong listing is paired with the restaurant","Ratings do not describe this location","H","OB,CN",[]],["Operator expects Tripadvisor to support the Google reply workflow","Review remains unanswered","M","CX",[]]]},{"id":"A5","b":"A","k":"dec","rel":"L","t":"Are connected sources ready?","d":"Fetch requires at least one connected source and all connected sources to be ready. Repair an incomplete connection and try again.","sys":["Web Dash: Review Management"],"e":[["One incomplete listing blocks the fetch for other ready sources","First import delayed","H","OB",[]],["Disabled action gives no indication which source needs attention","Operator cannot finish onboarding","M","CX",[]]]},{"id":"B1","b":"B","k":"cust","rel":"L","t":"Leave a review","d":"A guest posts a rating and optional text at the chosen provider. The original review belongs to that provider.","sys":["Web Dash: Review Management"],"e":[["Guest posts to a neighbouring branch","Review is missing from the intended inbox","H","CN",[]],["Rating without text is overlooked in a text search","Genuine rating goes unanswered","M","CX",[]]]},{"id":"B2","b":"B","k":"int","rel":"L","t":"Fetch restaurant reviews","d":"Fetch reviews submits collection work for connected sources. Check source totals as the results arrive.","sys":["Web Dash: Review Management","Google Business Profile","MoM"],"e":[["Google reviews stop syncing to MoM even though the listing has newer reviews","Manager misses new guest feedback","H","CN,T",["5032"]],["A retry imports a previously collected review again","Counts and reply workload increase","H","D,R",[]]]},{"id":"B3","b":"B","k":"op","rel":"L","t":"Recover a stale feed","d":"Compare a recent provider review with Web Dash and MoM. The scrum team reports that reconnecting Google is a workaround for PROD 5032.","sys":["Web Dash: Review Management","MoM","Google Business Profile"],"e":[["Reconnect selects another listing with a similar name","Gap is hidden by unrelated reviews","H","CN,OB",[]],["Only the displayed total is checked after reconnecting","Specific missing review remains absent","M","R,CX",[]]]},{"id":"C1","b":"C","k":"op","rel":"L","t":"Filter the inbox","d":"Filter by source, rating or reply and read status. Open a matching review and inspect its content. The dashboard saves the chosen reporting duration locally. Check the period again after moving between restaurants.","sys":["Web Dash: Review Management"],"e":[["Read and replied filters are confused","Unanswered complaint appears dealt with","H","CX",[]],["A retained source filter hides recent feedback","Operator believes collection has stopped","M","CX",[]]]},{"id":"C2","b":"C","k":"op","rel":"L","t":"Inspect review details","d":"Check the source, date, rating and text. Order or ticket context is available where the review has an associated ticket.","sys":["Web Dash: Review Management"],"e":[["Ticket context is displayed against the wrong review","Operator refers to another guest order","C","S,D",[]],["A provider review with no order link looks like an incomplete import","Unnecessary investigation","M","CX",[]]]},{"id":"C3","b":"C","k":"op","rel":"L","t":"Mark the review read","d":"Reading status and published response status are separate measures in Review Management.","sys":["Web Dash: Review Management"],"e":[["Marking read removes the review from an unread queue before anyone replies","Guest waits longer","M","CX",[]],["Mobile and dashboard read counts diverge","Two managers repeat triage","M","CN,R",[]]]},{"id":"C4","b":"C","k":"dec","rel":"L","t":"Does this source support replies?","d":"Google and Yelp have reply integrations. For other sources verify the available action before composing a public response.","sys":["Web Dash: Review Management"],"e":[["Unsupported source offers a reply action that fails at submit","Manager loses work","H","CN,CX",[]],["A reply action is unavailable for a supported review","Complaint cannot be answered from the inbox","H","CN",[]]]},{"id":"D1","b":"D","k":"op","rel":"L","t":"Compose a response","d":"Write a response or generate an AI suggestion for this review and edit the proposed wording before sending.","sys":["Web Dash: Review Management"],"e":[["Draft cites an item or refund absent from the review","Restaurant makes an incorrect public promise","H","CX",[]],["An earlier suggestion remains when the operator opens another review","Reply addresses the wrong guest","H","D,CX",[]]]},{"id":"D2","b":"D","k":"int","rel":"L","t":"Publish the response","d":"AIO forwards the response to Google or Yelp and stores the result locally. Existing replies can restrict a second submission depending on source.","sys":["Web Dash: Review Management","Google Business Profile","Yelp"],"e":[["Provider accepts the reply but local saving fails","Inbox still shows unanswered","H","CN,D",[]],["Two managers reply to the same review from different devices","Conflicting public responses","H","CX,D",[]]]},{"id":"D3","b":"D","k":"cust","rel":"L","t":"Read the public reply","d":"Check that the response visible on the source matches the restaurant, review and intended text.","sys":["Web Dash: Review Management"],"e":[["A local success message appears while the public reply is absent","Guest believes the complaint was ignored","H","CN,CX",[]],["Public reply contains personal order details from the inbox","Guest privacy is compromised","C","S,CX",[]]]},{"id":"D4","b":"D","k":"op","rel":"L","t":"Remove a Google reply","d":"The removal service calls Google and marks the saved reply deleted after success. Provider support varies.","sys":["Web Dash: Review Management"],"e":[["Google removes the reply but the inbox still shows replied","Staff cannot tell whether to respond again","H","D,CN",[]],["Operator expects the same removal option on another source","Incorrect response stays visible","M","CX",[]]]},{"id":"E1","b":"E","k":"op","rel":"L","t":"Generate restaurant insights","d":"Request analysis of available reviews. The service distinguishes an in-progress run from insufficient data and handles completion separately.","sys":["Web Dash: Review Management"],"e":[["Insufficient reviews leave the page waiting for a completion signal","Onboarding stalls","H","OB,T",[]],["An older summary appears while a new analysis is in progress","Operator acts on stale feedback","M","R,CX",[]]]},{"id":"E2","b":"E","k":"op","rel":"L","t":"Read themes and trends","d":"Inspect sentiments, keywords, categories and suggestions. Compare a theme to the underlying reviews and date range.","sys":["Web Dash: Review Management"],"e":[["A repeated review dominates a small sample","Priority is set from duplicate feedback","H","D,R",[]],["A filtered inbox is compared with restaurant-wide insights","Trend appears inconsistent","M","R",[]]]},{"id":"E3","b":"E","k":"op","rel":"L","t":"Check the mobile summary","d":"Compare MoM unread and negative counts with the same restaurant and source reviews in Web Dash.","sys":["Web Dash: Review Management","MoM"],"e":[["Mobile summary stays stale after the web inbox updates","Manager misses an urgent complaint","H","CN,R",[]],["Unread is interpreted as negative feedback","Wrong intervention prioritised","M","R,CX",[]]]},{"id":"E4","b":"E","k":"op","rel":"L","t":"Disconnect a source","d":"Use the source connection controls and confirm the intended restaurant before disconnecting.","sys":["Web Dash: Review Management"],"e":[["Disconnecting the wrong Google listing interrupts collection","New reviews disappear from the inbox","H","OB,CN",[]],["Old reviews still on screen imply that collection continues","Operator misses future feedback","M","CX",[]]]},{"id":"E5","b":"E","k":"term","rel":"L","t":"Confirm the outcome","d":"Compare the latest review, reply or connection state on the intended surface.","sys":["Web Dash: Review Management"],"e":[["Checking only a total hides a missing or duplicated individual review","Issue is closed prematurely","M","R,CX",[]]]},{"id":"E6","b":"E","k":"int","rel":"L","t":"Receive the weekly review report","d":"The restaurant weekly summary is scheduled and handed to the notification service for delivery. Compare the period and restaurant with the inbox, and check the recorded outcome separately from receipt.","sys":["Web Dash: Review Management","Email service"],"e":[["Report is sent to an outdated distribution list after a management change","Review details reach unintended recipients","C","S,OB",[]],["Delivery succeeds but its saved status fails to update","The same report may be sent again","M","D,T",[]]]},{"id":"E7","b":"E","k":"int","rel":"L","t":"Export review records","d":"The service produces a restaurant-specific Excel export containing review and analysis data. Confirm that the requesting role has the appropriate route to use it.","sys":["Web Dash: Review Management"],"e":[["An export is compared with a filtered inbox while the file contains a broader set","Review count appears inconsistent","M","R,CX",[]],["A download stops partway through and appears complete","Restaurant loses rows during reconciliation","H","D,R",[]]]}],"EDGES":[["A1","A2",""],["A2","A5",""],["A5","B1","Leave a review"],["B1","B2",""],["B2","C1",""],["C1","C2",""],["C2","C3",""],["C3","E3",""],["E3","E5",""],["A2","A3",""],["A3","A5",""],["A5","A3","Connect Yelp"],["A5","B2","Fetch restaurant reviews"],["C1","E5",""],["A1","B2",""],["B2","B3",""],["B3","A2",""],["B2","E3",""],["A1","C1",""],["C3","C4",""],["C4","D1","Compose a response"],["D1","D2",""],["D2","D3",""],["D3","E5",""],["C2","D4",""],["D4","D1",""],["A1","A4",""],["A4","A5",""],["C2","C4",""],["C4","E5","Confirm the outcome"],["A1","E1",""],["E1","E2",""],["E2","C1",""],["C2","E5",""],["A1","E4",""],["E4","E5",""],["A1","E6","Weekly report"],["E6","E2","Compare with insights"],["C1","E7","Export"],["E7","E5","Reconcile"]],"PATH_GROUPS":["Onboarding and sync","Reply handling","Analysis and maintenance"],"PATHS":[{"id":"P01","g":0,"t":"Connect Google and fetch","n":"Start with a single provider and confirm feedback in both views.","s":"A1 A2 A5 B1 B2 C1 C2 C3 E3 E5","side":""},{"id":"P02","g":0,"t":"Resolve incomplete multi-source setup","n":"Complete a missing Yelp listing before fetching alongside Google.","s":"A1 A2 A3 A5 A3 A5 B2 C1 E5","side":""},{"id":"P03","g":0,"t":"Recover missing mobile reviews","n":"Compare an identifiable review, reconnect and check the mobile summary.","s":"A1 B2 B3 A2 A5 B2 E3 E5","side":""},{"id":"P04","g":1,"t":"Publish a reply","n":"Read a Google or Yelp review and verify the public reply.","s":"A1 C1 C2 C3 C4 D1 D2 D3 E5","side":""},{"id":"P05","g":1,"t":"Correct a public Google response","n":"Verify the existing reply, remove it and send a corrected response.","s":"A1 C1 C2 D4 D1 D2 D3 E5","side":""},{"id":"P06","g":1,"t":"Read a Tripadvisor review","n":"Collect a review and check what action the provider supports.","s":"A1 A4 A5 B1 B2 C1 C2 C4 E5","side":""},{"id":"P07","g":2,"t":"Read generated insights","n":"Generate insights from available feedback and compare with source reviews.","s":"A1 E1 E2 C1 C2 E5","side":""},{"id":"P08","g":2,"t":"Disconnect a source","n":"Review the listing and confirm the change in connection state.","s":"A1 E4 E5","side":""},{"id":"P09","g":2,"t":"Reconcile the weekly review report","n":"Check the report period, supporting reviews and restaurant export.","s":"A1 E6 E2 C1 E7 E5","side":""}],"NOTES":["PROD 5032 records the MoM sync symptom. Reconnecting Google is a reported workaround. The production root cause is open.","The first fetch and insight status transitions are visible in Zeus. Provider collection cadence, exact analysis refresh time, mobile screens and notification delivery require operational verification.","Google and Yelp have outbound reply handlers. Google has a deletion handler. Tripadvisor reply publication was not found in the same path.","Weekly email scheduling and restaurant export are present. Confirm the actual recipients, delivery and mobile display with the restaurant.","Zeus internal, 02473c3bac9. See review-management/review/review.service.ts, the review relay and features/reviewManagement."]},"campaigns":{"name":"Campaigns","title":"Campaigns: operator and guest paths and what can go wrong","BANDS":[{"id":"A","t":"Enablement and sender setup","s":"Marketing email address, Twilio marketing number, monthly text limit and who may approve in MoM"},{"id":"B","t":"Campaign list and entry","s":"Choose a creation mode, act on a suggestion or open a campaign to see its available actions."},{"id":"C","t":"Build the campaign","s":"The dedicated email and SMS builders have four steps. The multichannel builder has six."},{"id":"D","t":"Submit, reserve and approve","s":"Check eligibility and credit reservations, then follow the chosen launch or owner review path."},{"id":"E","t":"Send pipeline","s":"Follow queued or scheduled work into dispatch, channel outcomes and status changes."},{"id":"F","t":"Guest receives and acts","s":"What the guest gets by email or text and what they do with it"},{"id":"G","t":"Manage a campaign after submission","s":"Edit a returned campaign, duplicate it, inspect its history or follow it to completion."},{"id":"H","t":"Measuring results","s":"Compare delivery, engagement, returning guests, attributed orders and sales."},{"id":"I","t":"Launch, cancel, end and attribute","s":"Check which actions the current status permits and how results count returning guests."}],"NODES":[{"id":"A1","b":"A","k":"term","rel":"L","t":"Restaurant wants to reach guests","d":"A restaurant operator or AIO staff member can create a custom promotion or base it on a deal, spotlight, menu item or special day and choose the channels that will carry it.","sys":["Web Dash: Campaigns"],"e":[["Operator does not know that email and text need a sender address and a registered number first","First campaign fails at submit","M","OB,CX",[]],["Location chosen in the restaurant switcher is not the one the operator means to market for","Campaign built for the wrong location","M","CX",[]]]},{"id":"A2","b":"A","k":"op","rel":"TBC","internalOnly":true,"t":"Select the campaign email sender","d":"At send time a verified, enabled restaurant domain can provide the From address. The feature and sending switches must allow it. The AIO address covers an ineligible domain, a failed lookup or a rejected custom sender.","sys":["Ops dashboard","Web Dash: Campaigns","Email service"],"e":[["A restaurant expects a branded sender while verification is pending","Guests see the AIO address","M","CX",[]],["The sender changes between preview and the scheduled send","The restaurant cannot explain the address on the received email","M","CX",[]],["The selected sender or reply address belongs to another restaurant","Guest replies reach the wrong restaurant","H","D",[]]]},{"id":"A3","b":"A","k":"int","rel":"TBC","internalOnly":true,"t":"Twilio marketing number registered","d":"A business needs a marketing number with an accepted verification status to submit a campaign with SMS. Delivery also needs the configured sender and Twilio subaccount. Check a configuration change again at send time.","sys":["Ops dashboard","Twilio"],"e":[["Number not yet approved for A2P 10DLC or toll-free verification but marked verified in AIO","Texts filtered by carriers, sent count looks fine","C","L,OB",[]],["Twilio configuration removed or changed after approval, relay skips the text pages without marking them failed","Campaign shows sent zero with no reason","H","T,R",[]],["Verification changes after the operator selects SMS","A previously available campaign channel cannot launch","M","CX",[]],["Sub-account auth token rotated in Twilio but not in AIO","Every text fails","H","T,OB",[]]]},{"id":"A4","b":"A","k":"soft","rel":"TBC","internalOnly":true,"t":"Monthly text limit applies","d":"The monthly marketing text allowance is shared with Journeys. A campaign reserves credits for eligible SMS guests, one per SMS or two per MMS recipient. Cancelling a scheduled send or rejecting a campaign releases its reservation.","sys":["Marketing Campaigns","Marketing Journeys","Email service"],"e":[["Reservation counts against the month of submission, not the month the campaign is scheduled to send","Next month's send blocks this month's quota","H","B,M",[]],["Month boundary taken from server time, not the restaurant time zone","Late evening submissions land in the wrong month","M","B,T",[]],["Reserved texts for guests with invalid numbers or later opt outs are never released","Limit used up by texts that were never sent","H","B,M",[]],["Threshold alert goes nowhere when the location has no Marketing email","Restaurant hits the limit with no warning","M","CX,OB",[]],["Limit is per location while the Twilio account and bill are per business","Multi-location tenants overspend on Twilio","M","B",[]]]},{"id":"A5","b":"A","k":"op","rel":"L","t":"Approver permission in MoM","d":"Only MoM users whose role grants the campaign approve permission for that location can approve, request edits or reject. A reminder job pushes a Review campaign notification to their online devices while campaigns wait in Sent for Review.","sys":["MoM","Ops dashboard"],"e":[["No user at the location holds the approve permission","Campaign waits until it expires","H","OB,S",[]],["Approver has MoM installed but no online device registered, so the reminder never arrives","Campaign expires unseen","H","CX,T",[]],["Staff member who left still holds the approve permission","Wrong person approves sends to the guest list","H","S,OB",[]]]},{"id":"B1","b":"B","k":"op","rel":"TBC","internalOnly":true,"t":"Open the Campaigns dashboard","d":"An empty restaurant sees the welcome view. The dashboard has campaign results, suggestions and a searchable list. Combine status, channel and type filters. Clearing filters preserves the search text.","sys":["Web Dash: Campaigns"],"e":[["A previous restaurant or filter still limits the list","A campaign appears missing","H","R",[]],["Clearing filters leaves a search term unnoticed","The list still looks incomplete","M","CX",[]]]},{"id":"B2","b":"B","k":"dec","rel":"TBC","internalOnly":true,"t":"Choose an entry or a row action","d":"Start an email, SMS or multichannel campaign, or use a contextual suggestion. The row and detail panel offer actions based on the stored status and selected channels.","sys":["Web Dash: Campaigns"],"e":[["A status changes while the action menu is open","An action fails and the operator needs to reload","M","CX",[]],["The operator starts multichannel when only one channel was intended","Extra steps or unintended placements are included","M","CX",[]]]},{"id":"C1","b":"C","k":"op","rel":"TBC","internalOnly":true,"t":"Choose campaign type","d":"Custom is the default. The other choices use a deal, spotlight, menu item or special day. Custom uses the operator description. Legacy Events is hidden.","sys":["Web Dash: Campaigns","Marketing Deals","Menu Manager"],"e":[["Changing the campaign type clears a previously chosen offer","The operator launches with the wrong content","M","CX",[]],["Deal later edited or deactivated in Deals while the campaign still promotes it","Guests sent an offer that no longer works","H","CN,CX",[]],["Menu item later deleted or hidden in Menu Manager","Campaign links to an item guests cannot order","H","CN",[]],["Deal list offers expired or future deals","Campaign promotes an offer that is not live","M","CN,CX",[]],["Custom special day created with a past date","Campaign about a day already gone","L","CX",[]]]},{"id":"C2","b":"C","k":"op","rel":"TBC","internalOnly":true,"t":"Name and describe the campaign","d":"Enter the campaign title and check name availability. For Custom, add the description used to prepare content. Record-backed types supply their own context.","sys":["Web Dash: Campaigns"],"e":[["Two operators pick the same name at the same moment, both pass the check","Duplicate names in the list","L","D",[]],["Custom campaign copy is built from an outdated description","The draft advertises the wrong offer","M","CX",[]]]},{"id":"C3","b":"C","k":"op","rel":"TBC","internalOnly":true,"t":"Choose channels","d":"The multichannel flow asks for channels. The dedicated email and SMS flows preset the channel and open content directly after campaign type. Kiosk and Mega kiosk can include a banner, screensaver or both.","sys":["Web Dash: Campaigns"],"e":[["Text chosen for a location without a verified marketing number, no warning until final submit","Operator rebuilds the campaign","M","CX,OB",[]],["Removing a channel on edit leaves its old content and results attached","Stale content in results","M","D",[]],["Operator assumes Email reaches all guests, but only subscribed guests with valid emails count","Smaller reach than expected","M","CX",[]]]},{"id":"C4","b":"C","k":"op","rel":"TBC","internalOnly":true,"t":"Define the audience","d":"Choose an audience using the available guest filters and inspect eligible recipients for each message channel. A message channel with no eligible audience needs attention before launch. SMS also checks verification and remaining credits.","sys":["Web Dash: Campaigns","Guestbook / CRM"],"e":[["A delayed eligibility estimate belongs to the previous filter selection","The operator misjudges audience size and SMS cost","M","CX",[]],["Allergen filter includes guests with the allergen when the offer is meant to avoid them","Wrong guests targeted","H","CX",[]],["Segment or spend tier recalculated between approval and send, list is not refreshed","Guests who left the segment still receive it","M","D",[]],["Guests shared across locations of the same business filtered per location only","Multi-location guest gets the same campaign from each location","M","CX,D",[]],["Filters combine as all must match, operator expects any","Audience empty","M","CX",[]]]},{"id":"C5","b":"C","k":"op","rel":"L","t":"Build the email","d":"The email builder fills heading, text, image and call to action from the deal, spotlight or item, styled from the Brand Book. Custom HTML sections are sanitised on save. The finished email is uploaded as an HTML file, up to 30 MB, and must keep the unsubscribe placeholder.","sys":["Web Dash: Campaigns","Brand Book","S3 / CDN"],"e":[["Media card colours lack brand swatches, the header uses a fixed colour, or text lacks heading and body styles","The operator must restyle each email by hand","M","CX",["4680"]],["Custom HTML removes the unsubscribe placeholder, email goes out with no working unsubscribe link","CAN-SPAM exposure","C","L",[]],["Sanitiser strips styles or links the operator pasted","Email looks different from the preview","M","CX",[]],["Brand Book colours or fonts changed after the email was built, saved HTML keeps the old style","Off-brand email","L","CN",[]],["Image file names with spaces or very large images break or slow the email","Broken images in the inbox","M","CX,T",[]],["Call to action points at a test or temporary online ordering link","Guests land on a dead page","H","CN,CX",[]],["HTML upload fails mid-wizard and the error is not shown","Operator submits an email with no template","H","T,CX",[]]]},{"id":"C6","b":"C","k":"op","rel":"L","t":"Generate copy with AI","d":"The operator can ask the AI assistant service to generate or regenerate campaign copy and images for the chosen type. The call times out after 30 seconds.","sys":["Web Dash: Campaigns","AI assistant service"],"e":[["AI states a discount, price or date that differs from the actual deal","Guests promised an offer the restaurant does not honour","C","M,L",[]],["Generation takes over 30 seconds and fails with a generic error","Operator gives up on AI","M","T,CX",[]],["Regenerate overwrites edits the operator made by hand","Work lost","M","CX",[]],["AI copy includes claims such as health or allergen statements","Legal exposure for the restaurant","H","L",[]]]},{"id":"C7","b":"C","k":"op","rel":"TBC","internalOnly":true,"t":"Compose SMS or MMS","d":"The composer allows 130 characters for SMS. An image switches it to MMS, with up to 1,500 characters and a displayed cost of two texts. It validates links and excludes emojis. Inspect the final content and opt-out line.","sys":["Web Dash: Campaigns","Twilio"],"e":[["Opt-out line appended again each time the form is submitted, so an edited campaign shows it twice","Messy text, extra segments billed","M","B,CX",[]],["Opt-out line added only by Web Dash, a campaign saved another way has none","TCPA exposure","C","L",[]],["An image changes the displayed cost from one text to two after audience selection","Projected usage and available credits disagree","H","B",[]],["Restaurant name missing from the message body","Carrier filtering and guest confusion","M","L,CX",[]],["MMS image too large or wrong type for carriers","Text delivered without the image or fails","M","T",[]]]},{"id":"C8","b":"C","k":"op","rel":"L","t":"Preview and send a test email","d":"Email and SMS quick creation show an inline preview while content is written. Multichannel creation has a separate preview step. Email also supports a test send.","sys":["Web Dash: Campaigns","Email service"],"e":[["Test email subject is not the real subject","Subject line never checked","M","CX",[]],["No test text message, the first real text is the first time anyone sees it","Broken links or formatting reach every guest","H","CX",[]],["Test endpoint sends any HTML to any address without a limit","Abuse of the restaurant sender address","H","S",[]],["Test reports success when queued even if delivery later fails","Operator thinks the email works","M","T",[]],["Preview frame differs from real mail clients, for example dark mode or Outlook","Broken layout in the inbox","M","CX",[]]]},{"id":"C9","b":"C","k":"op","rel":"TBC","internalOnly":true,"t":"Choose send time and end date","d":"Choose immediate or scheduled launch. A placement shown for a period needs an end date. Email or SMS alone has no placement end date. A linked deal limits its campaign schedule.","sys":["Web Dash: Campaigns"],"e":[["Schedule taken in the operator browser time zone, not the restaurant's","Send at the wrong local hour","H","T,CX",[]],["Send at a scheduled time before approval arrives, campaign expires instead of sending late","Campaign never goes out","H","CX",[]],["Texts allowed at any hour, including night time","TCPA quiet hours breach","C","L",[]],["A screen end date is earlier than the operator intended","Guests stop seeing the placement before the promotion finishes","H","CX",[]],["Deal end changed later, campaign end is not moved with it","Campaign promotes a finished deal","M","CN",[]]]},{"id":"C10","b":"C","k":"dec","rel":"TBC","internalOnly":true,"t":"Save, request review or launch","d":"Save progress as a draft, send for owner review, or choose direct launch and confirm. Launch follows the selected schedule.","sys":["Web Dash: Campaigns"],"e":[["Wizard data in browser storage restored into a different campaign or location","Wrong content submitted","M","D,CX",[]],["Double click on submit creates two campaigns","Guests receive the same campaign twice","H","D",[]]]},{"id":"C11","b":"C","k":"op","rel":"L","t":"Prepare a social post","d":"Select the social destinations, prepare their copy and media, and inspect the preview for each chosen platform. Connection and media requirements can differ by destination.","sys":["Web Dash: Campaigns","Social accounts"],"e":[["A disconnected account stays selected in the final preview","Approved content cannot be posted","H","OB,CN",[]],["A crop or caption fits one platform but cuts off a condition on another","Guests see incomplete offer terms","H","CX,CN",[]]]},{"id":"C12","b":"C","k":"op","rel":"L","t":"Prepare a featured placement","d":"Configure the selected placement content and review the corresponding website, online, QR, kiosk or menu board preview. Check the destination size and location.","sys":["Web Dash: Campaigns","Website builder","Kiosk","Menu Boards"],"e":[["Kiosk banner art is reused at full screen and crops the offer price","Guest sees an incomplete promotion","H","CN,CX",[]],["A QR placement opens an incorrect restaurant destination","Guest cannot redeem the offer","H","CN,CX",[]]]},{"id":"D1","b":"D","k":"soft","rel":"L","t":"Save the draft","d":"A Draft is stored with its content, tags and allergens but no audience snapshot, no text reservation and no end of campaign event.","sys":["Marketing Campaigns"],"e":[["Draft saved with a schedule date that passes before it is resumed","Submitting later fails or expires at once","M","CX",[]],["Referenced deal or item deleted while the campaign is a draft","Draft cannot be reopened","M","D,CN",[]]]},{"id":"D2","b":"D","k":"soft","rel":"L","t":"Snapshot the audience","d":"Submission validates the content and resolves eligible contacts for the selected restaurant and channels. A guest can qualify for one channel while lacking consent or a deliverable address for the other.","sys":["Marketing Campaigns","Guestbook / CRM"],"e":[["Snapshot taken at submit, guest who unsubscribes or opts out before a later send still receives it","CAN-SPAM or TCPA exposure","C","L,D",[]],["Failure after the campaign row is saved removes only the campaign, content rows are left behind","Orphan records","M","D",[]],["Guests with non-US phone numbers silently excluded","Smaller reach than expected","L","CX",[]],["Guests imported with consent assumed rather than recorded","TCPA exposure","C","L,OB",[]],["Large guest lists resolved in one query at submit","Submit times out for big tenants","M","T",[]]]},{"id":"D3","b":"D","k":"dec","rel":"L","t":"Within the text limit?","d":"Check the eligible SMS count against monthly credits and reserve the required balance on submission. An over-limit submission must be revised. A returned edit follows the review choice recorded by the owner. Email-only campaigns proceed without an SMS reservation.","sys":["Marketing Campaigns","Marketing Journeys"],"e":[["L
